<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>AI 助手</title>
  <style>
    /* ── tokens ───────────────────────────────────────────────────────────── */
    :root {
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
        'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-code: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', Menlo,
        'PingFang SC', 'Microsoft YaHei';
      --bg: #ffffff;
      --bg-elev: #ffffff;
      --text: #0f1115;
      --text-2: #54555a;
      --text-3: #7f8287;
      --text-cap: #a2a4a6;
      --border: rgba(0, 0, 0, 0.08);
      --border-strong: rgba(0, 0, 0, 0.14);
      --hover: rgba(38, 49, 72, 0.06);
      --hover-solid: #f5f6f7;
      --bubble: #edf3fe;
      --bubble-text: #0f1115;
      --accent: #4176e6;
      --accent-strong: #2f63d4;
      --accent-soft: #eef4ff;
      --code-bg: #f7f8fa;
      --code-border: rgba(0, 0, 0, 0.06);
      --inline-code: #f2f3f5;
      --danger: #e5484d;
      --danger-soft: rgba(229, 72, 77, 0.08);
      --success: #22c55e;
      --warn: #dd8629;
      --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.02), 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-float: 0 4px 20px rgba(0, 0, 0, 0.1);
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --content-width: 80%;
      --content-max: none;
      --mark-gradient: linear-gradient(135deg, #4176e6 0%, #7aa2ff 100%);
      --ctx-system: #8b5cf6;
      --ctx-tools: #0ea5e9;
      --ctx-user: #4176e6;
      --ctx-inject: #f59e0b;
      --ctx-skill: #ec4899;
      --ctx-assistant: #22c55e;
      --ctx-tool: #14b8a6;
      --ctx-overhead: #94a3b8;
      --feat-memory: #8b5cf6;
      --feat-stage: #0ea5e9;
      --feat-schedule: #f59e0b;
      --feat-knowledge: #14b8a6;
      --feat-compact: #ec4899;
      color-scheme: light;
    }
    html[data-theme='dark'] {
      --bg: #0f1115;
      --bg-elev: #17191e;
      --text: #f2f4f7;
      --text-2: #b8bec8;
      --text-3: #979da6;
      --text-cap: #6f757e;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --hover: rgba(255, 255, 255, 0.06);
      --hover-solid: #23252b;
      --bubble: #212733;
      --bubble-text: #f2f4f7;
      --accent: #679efe;
      --accent-strong: #8bb5ff;
      --accent-soft: #1b2433;
      --code-bg: #16181d;
      --code-border: rgba(255, 255, 255, 0.07);
      --inline-code: #24262c;
      --danger: #ff6b6f;
      --danger-soft: rgba(255, 107, 111, 0.12);
      --success: #4ade80;
      --warn: #f2b35c;
      --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.25);
      --shadow-float: 0 4px 20px rgba(0, 0, 0, 0.45);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow: hidden;
    }
    button, input, textarea { font-family: inherit; }
    button { color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
    ::selection { background: color-mix(in srgb, var(--accent) 24%, transparent); }

    * { scrollbar-width: thin; scrollbar-color: rgba(0, 0, 0, 0.18) transparent; }
    html[data-theme='dark'] * { scrollbar-color: rgba(255, 255, 255, 0.18) transparent; }
    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.16); border-radius: 8px; }
    *::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.26); }
    html[data-theme='dark'] *::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.16); }
    html[data-theme='dark'] *::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.26); }

    /* ── shell ────────────────────────────────────────────────────────────── */
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

    #header {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      height: 56px;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: relative;
      z-index: 6;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-mark {
      flex: none;
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 9px;
      background: var(--mark-gradient);
      color: #fff;
      box-shadow: 0 2px 6px color-mix(in srgb, var(--accent) 28%, transparent);
    }
    #title {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      line-height: 22px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #subtitle {
      font-size: 12px;
      line-height: 18px;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-right { display: flex; align-items: center; gap: 12px; min-width: 0; }
    #model-chip {
      max-width: 180px;
      overflow: hidden;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--hover-solid);
      color: var(--text-3);
      font-size: 12px;
      line-height: 18px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    #connection { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); white-space: nowrap; }
    #status-dot { width: 7px; height: 7px; border-radius: 50%; background: #c9ccd1; transition: background 0.2s; flex: none; }
    #status-dot.connected { background: var(--success); }
    #status-dot.running { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
    #status-dot.error { background: var(--danger); }
    @keyframes pulse { 50% { opacity: 0.35; } }

    .icon-btn {
      flex: none;
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      padding: 0;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: var(--text-3);
      cursor: pointer;
      transition: background 0.15s var(--ease), color 0.15s var(--ease);
    }
    .icon-btn:hover { background: var(--hover); color: var(--text); }

    /* ── tabs ─────────────────────────────────────────────────────────────── */
    #tabs {
      flex: none;
      display: flex;
      gap: 30px;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: relative;
      z-index: 5;
    }
    .tab {
      position: relative;
      padding: 10px 2px 11px;
      border: none;
      background: transparent;
      color: var(--text-3);
      font-size: 13px;
      line-height: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.15s var(--ease);
    }
    .tab:hover { color: var(--text-2); }
    .tab.active { color: var(--accent); }
    .tab.active::after {
      content: '';
      position: absolute;
      right: 0;
      bottom: -1px;
      left: 0;
      height: 2px;
      border-radius: 2px;
      background: var(--accent);
    }

    /* ── views / transcript ───────────────────────────────────────────────── */
    #body { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .view { display: none; flex: 1; min-height: 0; flex-direction: column; }
    .view.active { display: flex; }
    #transcript { position: relative; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
    #messages {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: var(--content-width);
      max-width: var(--content-max);
      margin: 0 auto;
      padding: 24px 24px 12px;
    }

    /* hero */
    #hero { display: none; flex: 1; align-items: center; justify-content: center; padding: 0 24px 64px; }
    #app.empty #hero { display: flex; }
    #app.empty #transcript { display: flex; flex-direction: column; }
    #app.empty #messages, #app.empty #bottom-seat, #app.empty #to-bottom { display: none; }
    .hero-stack { display: flex; flex-direction: column; gap: 26px; width: var(--content-width); max-width: var(--content-max); }
    .hero-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 26px;
      line-height: 32px;
      font-weight: 500;
      color: var(--text);
      text-align: center;
      letter-spacing: 0.2px;
    }
    .hero-title .brand-mark { width: 34px; height: 34px; border-radius: 11px; }

    /* ── flow items ───────────────────────────────────────────────────────── */
    .turn { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .turn:empty { display: none; }

    .user-row { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .user-stack { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; max-width: min(525px, 82%); min-width: 0; }
    .user-bubble {
      max-width: 100%;
      padding: 10px 16px;
      border-radius: 22px;
      background: var(--bubble);
      color: var(--bubble-text);
      font-size: 16px;
      line-height: 24px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user-bubble.scene { background: var(--accent-soft); color: var(--text-2); }
    .user-images { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .user-images img {
      max-width: 240px;
      max-height: 240px;
      border-radius: 14px;
      border: 1px solid var(--border);
      cursor: zoom-in;
      display: block;
    }

    .assistant-msg { min-width: 0; max-width: 100%; }

    .markdown { font-size: 16px; line-height: 28px; color: var(--text); overflow-wrap: anywhere; }
    .markdown > * { margin: 0; }
    .markdown > * + * { margin-top: 16px; }
    .markdown h1, .markdown h2, .markdown h3, .markdown h4 {
      margin: 0;
      font-weight: 600;
      line-height: 1.4;
    }
    .markdown h1 { font-size: 24px; }
    .markdown h2 { font-size: 21px; }
    .markdown h3 { font-size: 18px; }
    .markdown h4 { font-size: 16px; }
    .markdown ul, .markdown ol { padding-left: 26px; }
    .markdown li + li { margin-top: 4px; }
    .markdown li > p { display: inline; }
    .markdown blockquote {
      padding: 2px 0 2px 14px;
      border-left: 3px solid var(--border-strong);
      color: var(--text-2);
    }
    .markdown hr { border: none; border-top: 1px solid var(--border); }
    .markdown a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
    .markdown strong { font-weight: 600; }
    .markdown code {
      padding: 1px 5px;
      border-radius: 5px;
      background: var(--inline-code);
      font-family: var(--font-code);
      font-size: 13px;
      line-height: 1.6;
    }
    .markdown pre {
      position: relative;
      padding: 13px 15px;
      border: 1px solid var(--code-border);
      border-radius: 12px;
      background: var(--code-bg);
      overflow: auto;
      font-family: var(--font-code);
      font-size: 13px;
      line-height: 1.65;
      tab-size: 2;
    }
    .markdown pre code { padding: 0; background: none; font-size: inherit; }
    .markdown table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 22px; }
    .markdown th, .markdown td { padding: 6px 10px; border: 1px solid var(--border); text-align: left; }
    .markdown th { background: var(--hover-solid); font-weight: 600; }

    /* reasoning + tool + event rows */
    .reasoning, .tool-row, .event-row, .context-row, .raw-row { border-radius: 8px; }
    .reasoning > summary, .tool-row > summary, .event-row > summary, .context-row > summary, .raw-row > summary {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 1px 6px;
      margin: 0 -6px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      line-height: 24px;
      color: var(--text-2);
      user-select: none;
      position: relative;
      overflow: hidden;
    }
    .reasoning > summary::-webkit-details-marker,
    .tool-row > summary::-webkit-details-marker,
    .event-row > summary::-webkit-details-marker,
    .context-row > summary::-webkit-details-marker,
    .raw-row > summary::-webkit-details-marker { display: none; }
    .reasoning > summary:hover, .tool-row > summary:hover,
    .event-row > summary:hover, .context-row > summary:hover, .raw-row > summary:hover { background: var(--hover); }
    .chev {
      flex: none;
      width: 6px;
      height: 6px;
      margin: 0 4px 2px 0;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg);
      transition: transform 0.15s var(--ease);
      opacity: 0.75;
    }
    details[open] > summary > .chev { transform: rotate(-135deg); margin-bottom: -1px; }
    .row-title { flex: none; color: var(--text-2); }
    .row-sep { flex: none; width: 2px; height: 2px; margin: 0 2px; border-radius: 1px; background: var(--text-cap); }
    .row-summary {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-3);
    }
    .row-icon { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; color: var(--text-3); }
    .row-status { flex: none; width: 16px; text-align: center; font-size: 12px; color: var(--text-3); }
    .reasoning > summary { color: var(--text-3); }
    .reasoning .row-title { color: var(--text-3); }
    .reasoning-body, .tool-body, .event-body, .context-body {
      padding: 4px 0 4px 22px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .reasoning-body {
      color: var(--text-3);
      font-size: 14px;
      line-height: 24px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .tool-body pre, .event-body pre, .context-body pre {
      margin: 0;
      padding: 10px 12px;
      border: 1px solid var(--code-border);
      border-radius: 10px;
      background: var(--code-bg);
      font-family: var(--font-code);
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 360px;
      overflow: auto;
    }
    .tool-body .result-label, .event-body .result-label { font-size: 12px; color: var(--text-cap); }
    .tool-row[data-state='error'] .row-status { color: var(--danger); }
    .tool-row[data-state='error'] .row-summary { color: var(--danger); }
    .tool-row[data-state='running'] > summary::after,
    .reasoning[data-state='running'] > summary::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 280px;
      background: linear-gradient(90deg, transparent 0%, color-mix(in srgb, var(--bg) 62%, transparent) 55%, transparent 100%);
      animation: sweep 2.6s ease-out infinite;
      pointer-events: none;
    }
    @keyframes sweep { 0% { left: -280px; } 90%, 100% { left: 100%; } }
    @media (prefers-reduced-motion: reduce) {
      .tool-row[data-state='running'] > summary::after,
      .reasoning[data-state='running'] > summary::after { animation: none; }
    }

    .context-row > summary { color: var(--text-3); font-size: 13px; }
    .event-row > summary { color: var(--text-3); font-size: 13px; }
    .event-row .row-title { color: var(--text-2); }
    .event-body { color: var(--text-2); font-size: 13px; line-height: 20px; }
    .event-meta { white-space: pre-wrap; overflow-wrap: anywhere; }

    .raw-row > summary { color: var(--text-cap); font-size: 11px; line-height: 18px; }
    .raw-row > pre {
      margin: 4px 0 0;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      color: var(--text-3);
      font-family: var(--font-code);
      font-size: 11px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 320px;
      overflow: auto;
    }

    .stage-speech {
      align-self: flex-start;
      padding: 2px 12px;
      border-radius: 12px;
      background: var(--accent-soft);
      color: var(--text-2);
      font-size: 14px;
      line-height: 24px;
      max-width: 100%;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .error-row {
      align-self: flex-start;
      max-width: 100%;
      padding: 6px 12px;
      border-radius: 10px;
      background: var(--danger-soft);
      color: var(--danger);
      font-size: 13px;
      line-height: 20px;
      overflow-wrap: anywhere;
    }

    /* turn status shimmer */
    .turn-status {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      height: 26px;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent) 40%, var(--accent-soft) 50%, var(--accent) 60%, var(--accent) 100%);
      background-size: 250% 100%;
      background-position: 100% 0;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 1.8s linear infinite;
    }
    .turn-status-clock {
      margin-left: 8px;
      font-size: 13px;
      font-weight: 400;
      color: var(--text-cap);
      -webkit-text-fill-color: var(--text-cap);
      font-variant-numeric: tabular-nums;
    }
    @keyframes shimmer { to { background-position: 0 0; } }
    @media (prefers-reduced-motion: reduce) {
      .turn-status { animation: none; background: none; color: var(--text-3); -webkit-text-fill-color: var(--text-3); }
    }

    /* back to bottom */
    #to-bottom {
      position: absolute;
      right: max(16px, calc((100% - var(--content-width)) / 2 + 8px));
      bottom: 14px;
      z-index: 5;
      display: none;
      place-items: center;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg-elev);
      color: var(--text-2);
      box-shadow: var(--shadow-card);
      cursor: pointer;
    }
    #to-bottom.visible { display: grid; }
    #to-bottom:hover { background: var(--hover-solid); }

    /* ── composer ─────────────────────────────────────────────────────────── */
    #bottom-seat {
      flex: none;
      z-index: 6;
      padding: 6px 0 0;
      background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 0%, transparent) 0px, var(--bg) 26px);
    }
    #dock-slot { display: flex; justify-content: center; width: var(--content-width); max-width: var(--content-max); margin: 0 auto; }
    #composer { width: 100%; margin: 0 auto; }
    #composer-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px 8px;
      border: 1px solid var(--border-strong);
      border-radius: 22px;
      background: var(--bg-elev);
      box-shadow: var(--shadow-card);
      transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
    }
    #composer-card.dragover { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
    #composer-card:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, var(--border-strong)); }
    #input {
      width: 100%;
      max-height: 336px;
      min-height: 28px;
      padding: 4px 6px 0;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      line-height: 24px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    #input::placeholder { color: var(--text-cap); }
    #input:disabled { color: var(--text-3); cursor: not-allowed; }
    .composer-row { display: flex; align-items: center; gap: 8px; padding: 0 2px; }
    #attach {
      flex: none;
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      border-radius: 999px;
      background: var(--hover-solid);
      color: var(--text-2);
      cursor: pointer;
      transition: background 0.15s var(--ease), color 0.15s var(--ease);
    }
    #attach:hover:not(:disabled) { background: var(--hover); color: var(--text); }
    #attach:disabled { opacity: 0.45; cursor: default; }
    .composer-hint { flex: 1 1 auto; min-width: 0; font-size: 12px; line-height: 18px; color: var(--text-cap); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #send {
      flex: none;
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: background 0.15s var(--ease), opacity 0.15s var(--ease), transform 0.1s var(--ease);
    }
    #send:hover:not(:disabled) { background: var(--accent-strong); }
    #send:active:not(:disabled) { transform: scale(0.94); }
    #send:disabled { background: var(--hover-solid); color: var(--text-cap); cursor: default; }

    #attachment-preview { display: none; flex-wrap: wrap; gap: 8px; padding: 2px 4px 8px; }
    #attachment-preview.visible { display: flex; }
    .pending-image {
      position: relative;
      width: 56px;
      height: 56px;
      border-radius: 10px;

    /* ── swarm ─────────────────────────────────────────────────────────── */

    .swarm-context-entry .v { color: var(--text-2); white-space: pre-wrap; word-break: break-word; }
    .swarm-pending { color: var(--accent); font-size: 12px; margin-top: 8px; }

    .swarm-card { border: 1px solid var(--border); border-radius: 14px; background: var(--panel, var(--bg)); padding: 14px; cursor: pointer; transition: transform .16s var(--ease), box-shadow .16s var(--ease), border-color .16s, opacity .16s; display: flex; flex-direction: column; gap: 8px; }

    .swarm-dot.done { background: #3b82f6; }

    .swarm-badge.mode { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent); }

    .swarm-focus-bar { display: none; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); background: var(--bg-soft, #f5f7fa); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }

    .swarm-feed-route { font-weight: 600; font-size: 11.5px; color: var(--text-2); }

    .swarm-empty { text-align: center; color: var(--text-3); padding: 44px 16px; font-size: 13px; line-height: 1.7; }
    #swarm-drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(560px, 94%); background: var(--bg); border-left: 1px solid var(--border); box-shadow: -18px 0 40px rgba(16, 24, 40, .14); display: flex; flex-direction: column; z-index: 30; }

    .swarm-drawer-body { flex: 1; overflow-y: auto; padding: 14px 16px 30px; display: flex; flex-direction: column; gap: 10px; }
    .swarm-event { font-size: 12.5px; line-height: 1.6; border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; background: var(--panel, var(--bg)); }
    .swarm-event .tag { font-size: 10.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; display: block; margin-bottom: 3px; }
    .swarm-event.user { background: var(--bg-soft, #f6f7fa); }

    @media (max-width: 760px) {
      #swarm-inner { padding: 16px 12px 60px; }
      #swarm-drawer { width: 100%; }
    }
  </style>
</head>

<script>
(() => {
  'use strict'

  // ── DOM ───────────────────────────────────────────────────────────────────
  const $app = document.getElementById('app')
  const $transcript = document.getElementById('transcript')
  const $messages = document.getElementById('messages')
  const $heroSlot = document.getElementById('hero-slot')
  const $dockSlot = document.getElementById('dock-slot')
  const $composer = document.getElementById('composer')
  const $composerCard = document.getElementById('composer-card')
  const $input = document.getElementById('input')
  const $send = document.getElementById('send')
  const $attach = document.getElementById('attach')
  const $imageInput = document.getElementById('image-input')
  const $attachmentPreview = document.getElementById('attachment-preview')
  const $stats = document.getElementById('stats-line')
  const $toBottom = document.getElementById('to-bottom')
  const $dot = document.getElementById('status-dot')
  const $statusText = document.getElementById('status-text')
  const $title = document.getElementById('title')
  const $modelChip = document.getElementById('model-chip')
  const $lightbox = document.getElementById('lightbox')
  const $lightboxImg = $lightbox.querySelector('img')
  const $themeToggle = document.getElementById('theme-toggle')
  const $themeIcon = document.getElementById('theme-icon')
  const $composerHint = document.getElementById('composer-hint')
  const $tabs = document.getElementById('tabs')
  const $chatView = document.getElementById('chat-view')
  const $contextView = document.getElementById('context-view')
  const $contextScroll = document.getElementById('context-scroll')
  const $contextInner = document.getElementById('context-inner')
  const $swarmView = document.getElementById('swarm-view')
  const $swarmInner = document.getElementById('swarm-inner')
  const $swarmDrawer = document.getElementById('swarm-drawer')
  const $swarmDrawerDot = document.getElementById('swarm-drawer-dot')
  const $swarmDrawerTitle = document.getElementById('swarm-drawer-title')
  const $swarmDrawerMeta = document.getElementById('swarm-drawer-meta')
  const $swarmDrawerBody = document.getElementById('swarm-drawer-body')
  const $swarmDrawerClose = document.getElementById('swarm-drawer-close')

  // ── state ─────────────────────────────────────────────────────────────────
  let apiKey = readInitialApiKey()
  let authPrompting = false
  let httpInteractionBase = ''
  let httpChannelEnabled = true
  let sse = null
  let reloading = false
  let currentTurn = null
  let turnParent = null
  let currentAssistant = null
  let currentTool = null
  let pendingReasoning = ''
  let currentRawGroup = null
  let currentRawEvents = []
  let currentRawCounts = {}
  let pendingImageFiles = []
  let pinned = true
  let turnTimer = null
  let turnStartedAt = 0
  let empty = false
  let activeTab = 'chat'
  let contextSnapshot = null
  let contextError = ''
  let contextLoading = false
  let contextExpanded = new Set()
  let contextOpenGroups = new Set(['system', 'tools', 'user', 'inject', 'skill', 'assistant', 'tool'])
  let contextNodeCache = new Map()
  let contextNodeInflight = new Set()
  let contextSearch = ''
  let contextPollTimer = null
  let contextFilter = 'all'
  let contextSort = 'position'
  let contextEventFilter = 'all'
  let contextFileFilter = 'all'
  let contextFileSearch = ''
  let contextTrendGranularity = 'step'
  let contextTrendMode = 'total'
  let contextTrendSelection = null
  let swarmSnapshot = null
  let swarmError = ''
  let swarmLoading = false
  let swarmPollTimer = null
  let swarmFocusId = null
  let swarmDrawerId = null
  let swarmDrawerSource = null
  let swarmDrawerSeq = -1
  let swarmDrawerEventCount = 0
  let swarmContextOpen = false
  let pendingScrollItemId = null
  let pendingScrollCardId = null
  // 原始事件属于调试信息：默认不进入对话流，URL 加 ?debug=1 才显示。
  const DEBUG = (() => {
    try { return new URLSearchParams(location.search).has('debug') } catch { return false }
  })()

  const API_BASE = (() => {
    const matched = location.pathname.match(/^\/a\/[^/]+/)
    return matched ? matched[0] : ''
  })()

  // ── auth ──────────────────────────────────────────────────────────────────
  function readInitialApiKey() {
    const hash = location.hash.startsWith('#') ? location.hash.slice(1) : ''
    const fromHash = new URLSearchParams(hash).get('api_key')
    if (fromHash) {
      localStorage.setItem('assistant-webui-api-key', fromHash)
      history.replaceState(null, '', location.pathname + location.search)
      return fromHash
    }
    return localStorage.getItem('assistant-webui-api-key') || ''
  }

  function withAuth(path) {
    const interaction = /^\/api\/(message|stream)(?:\?|$)/.test(path)
    const base = interaction && !API_BASE ? httpInteractionBase : API_BASE
    const url = path.startsWith('/') ? base + path : path
    if (apiKey.length === 0) return url
    const sep = url.includes('?') ? '&' : '?'
    return url + sep + 'api_key=' + encodeURIComponent(apiKey)
  }

  function authHeaders() {
    return apiKey.length > 0 ? { Authorization: 'Bearer ' + apiKey } : {}
  }

  function requestApiKey() {
    if (authPrompting) return
    authPrompting = true
    if (window.self !== window.top) {
      authPrompting = false
      setConnection('', 'API Key 失效，请在 Console 中刷新')
      return
    }
    const value = window.prompt('请输入 API Key（可在 Console 中生成）', apiKey)
    authPrompting = false
    if (typeof value === 'string' && value.trim().length > 0) {
      apiKey = value.trim()
      localStorage.setItem('assistant-webui-api-key', apiKey)
      location.reload()
    }
  }

  async function apiFetch(url, options = {}) {
    const res = await fetch(withAuth(url), {
      ...options,
      headers: { ...(options.headers || {}), ...authHeaders() },
    })
    if (res.status === 401) {
      requestApiKey()
      throw new Error('unauthorized')
    }
    return res
  }

  // ── helpers ───────────────────────────────────────────────────────────────
  function el(tag, className, text) {
    const node = document.createElement(tag)
    if (className) node.className = className
    if (text !== undefined) node.textContent = text
    return node
  }

  function fmtTokens(n) {
    if (!Number.isFinite(n) || n <= 0) return '0'
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M'
    if (n >= 1000) return (n / 1000).toFixed(1) + 'K'
    return String(Math.round(n))
  }

  function fmtDuration(ms) {
    if (!ms) return '0s'
    const s = Math.floor(ms / 1000)
    if (s < 60) return s + 's'
    return Math.floor(s / 60) + '分' + (s % 60) + '秒'
  }

  function pretty(value) {
    if (typeof value === 'string') {
      try { return JSON.stringify(JSON.parse(value), null, 2) } catch { return value }
    }
    try { return JSON.stringify(value ?? null, null, 2) } catch { return String(value) }
  }

  function contentText(content) {
    if (!Array.isArray(content)) return ''
    return content.flatMap(block => {
      if (block?.type === 'text' || block?.type === 'reasoning') return [block.text || '']
      if (block?.type === 'tool-result') return [contentText(block.content)]
      if (block?.type === 'image') return ['[图片]']
      return []
    }).filter(Boolean).join('\n')
  }

  function plainText(content) {
    if (!Array.isArray(content)) return ''
    return content.filter(block => block?.type === 'text').map(block => block.text || '').join('\n')
  }

  function formatClock(ms) {
    const total = Math.max(0, Math.floor(ms / 1000))
    return Math.floor(total / 60) + ':' + String(total % 60).padStart(2, '0')
  }

  // ── markdown ──────────────────────────────────────────────────────────────
  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
  }

  function inlineMarkdown(escaped) {
    const codes = []
    let text = escaped.replace(/`([^`\n]+)`/g, (_, code) => {
      codes.push(code)
      return '\u0000' + (codes.length - 1) + '\u0000'
    })
    text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) =>
      '<a href="' + url + '" target="_blank" rel="noreferrer noopener">' + label + '</a>')
    text = text.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    text = text.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    text = text.replace(/~~([^~\n]+)~~/g, '<del>$1</del>')
    text = text.replace(/\u0000(\d+)\u0000/g, (_, index) => '<code>' + codes[Number(index)] + '</code>')
    return text
  }

  function renderMarkdown(source) {
    const input = String(source ?? '').replace(/\r\n?/g, '\n')
    if (!input.trim()) return ''
    const lines = input.split('\n')
    const out = []
    let paragraph = []
    let list = null

    const flushParagraph = () => {
      if (paragraph.length === 0) return
      out.push('<p>' + paragraph.map(inlineMarkdown).join('<br>') + '</p>')
      paragraph = []
    }
    const flushList = () => {
      if (list === null) return
      out.push('<' + list.type + '>' + list.items.map(item => '<li>' + inlineMarkdown(item) + '</li>').join('') + '</' + list.type + '>')
      list = null
    }
    const isTableSeparator = (text) => {
      const trimmed = text.trim().replace(/^\|/, '').replace(/\|$/, '')
      if (!trimmed.includes('-')) return false
      return trimmed.split('|').every(cell => /^\s*:?-{2,}:?\s*$/.test(cell))
    }
    const splitTableRow = (text) => text.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim())

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i]
      const fence = /^```([\w+.-]*)\s*$/.exec(line)
      if (fence) {
        flushParagraph(); flushList()
        const lang = fence[1] || ''
        const code = []
        i++
        while (i < lines.length && !/^```\s*$/.test(lines[i])) { code.push(lines[i]); i++ }
        out.push('<pre' + (lang ? ' data-lang="' + escapeHtml(lang) + '"' : '') + '><code>' + escapeHtml(code.join('\n')) + '</code></pre>')
        continue
      }
      if (/^\s*$/.test(line)) { flushParagraph(); flushList(); continue }
      if (/^\s*([-*_])\s*(?:\1\s*){2,}$/.test(line)) { flushParagraph(); flushList(); out.push('<hr>'); continue }
      // GFM 表格：表头行 + 分隔行
      if (line.includes('|') && i + 1 < lines.length && isTableSeparator(lines[i + 1])) {
        flushParagraph(); flushList()
        const header = splitTableRow(line)
        i += 2
        const rows = []
        while (i < lines.length && lines[i].includes('|') && lines[i].trim() !== '') {
          rows.push(splitTableRow(lines[i]))
          i++
        }
        i--
        out.push(
          '<table><thead><tr>' + header.map(cell => '<th>' + inlineMarkdown(escapeHtml(cell)) + '</th>').join('') + '</tr></thead><tbody>' +
          rows.map(row => '<tr>' + row.map(cell => '<td>' + inlineMarkdown(escapeHtml(cell)) + '</td>').join('') + '</tr>').join('') +
          '</tbody></table>',
        )
        continue
      }
      const heading = /^(#{1,6})\s+(.*)$/.exec(line)
      if (heading) {
        flushParagraph(); flushList()
        const level = heading[1].length
        out.push('<h' + level + '>' + inlineMarkdown(escapeHtml(heading[2])) + '</h' + level + '>')
        continue
      }
      const unordered = /^\s*[-*+]\s+(.*)$/.exec(line)
      const ordered = /^\s*\d+[.)]\s+(.*)$/.exec(line)
      if (unordered || ordered) {
        flushParagraph()
        const type = unordered ? 'ul' : 'ol'
        if (list === null || list.type !== type) { flushList(); list = { type, items: [] } }
        list.items.push(escapeHtml((unordered || ordered)[1]))
        continue
      }
      const quote = /^>\s?(.*)$/.exec(line)
      if (quote) {
        flushParagraph(); flushList()
        out.push('<blockquote>' + inlineMarkdown(escapeHtml(quote[1])) + '</blockquote>')
        continue
      }
      paragraph.push(escapeHtml(line))
    }
    flushParagraph(); flushList()
    return out.join('')
  }

  // ── shell helpers ─────────────────────────────────────────────────────────
  function setConnection(kind, text) {
    $dot.className = kind
    $statusText.textContent = text
  }

  function placeComposer(isEmpty) {
    if (isEmpty) {
      if ($composer.parentNode !== $heroSlot) $heroSlot.appendChild($composer)
    } else if ($composer.parentNode !== $dockSlot) {
      $dockSlot.appendChild($composer)
    }
  }

  function setEmpty(next) {
    if (empty === next) return
    empty = next
    $app.classList.toggle('empty', next)
    placeComposer(next)
    if (!next) $input.focus({ preventScroll: true })
  }

  function hasMessages() {
    return $messages.children.length > 0
  }

  function isNearBottom() {
    return $transcript.scrollHeight - $transcript.scrollTop - $transcript.clientHeight < 120
  }

  function scrollBottom(force = false) {
    if (!force && !pinned) return
    pinned = true
    $transcript.scrollTop = $transcript.scrollHeight
    // 字体、图片、markdown 渲染可能在下一帧继续撑高内容，再补一次。
    requestAnimationFrame(() => {
      if (pinned) $transcript.scrollTop = $transcript.scrollHeight
    })
    // 部分布局（字体度量、换行、滚动条）在首帧之后才稳定，补两次延迟滚动。
    setTimeout(() => { if (pinned) $transcript.scrollTop = $transcript.scrollHeight }, 80)
    setTimeout(() => { if (pinned) $transcript.scrollTop = $transcript.scrollHeight }, 320)
  }

  function updateToBottom() {
    $toBottom.classList.toggle('visible', hasMessages() && !pinned)
  }

  // ── flow ──────────────────────────────────────────────────────────────────
  function ensureTurn() {
    if (currentTurn) return currentTurn
    currentTurn = el('div', 'turn')
    ;(turnParent || $messages).appendChild(currentTurn)
    currentTool = null
    currentRawGroup = null
    currentRawEvents = []
    currentRawCounts = {}
    if (empty) setEmpty(false)
    return currentTurn
  }

  function appendToTurn(node) {
    if (!currentTurn) ensureTurn()
    // 生成状态行始终停在本轮末尾：新内容插到它前面，而不是追加到它后面。
    const statusRow = currentTurn.querySelector('.turn-status')
    if (statusRow) {
      currentTurn.insertBefore(node, statusRow)
    } else if (currentRawGroup && currentRawGroup.parentNode === currentTurn) {
      currentTurn.insertBefore(node, currentRawGroup)
    } else {
      currentTurn.appendChild(node)
    }
    if (pinned) scrollBottom()
  }

  function startTurnStatus() {
    ensureTurn()
    if (turnTimer) return
    turnStartedAt = Date.now()
    const row = el('div', 'turn-status')
    const label = el('span', '', '正在生成…')
    const clock = el('span', 'turn-status-clock', '0:00')
    row.append(label, clock)
    const existing = currentTurn.querySelector('.turn-status')
    if (existing) existing.remove()
    appendToTurn(row)
    turnTimer = setInterval(() => { clock.textContent = formatClock(Date.now() - turnStartedAt) }, 1000)
  }

  function stopTurnStatus() {
    if (turnTimer) { clearInterval(turnTimer); turnTimer = null }
    const row = currentTurn ? currentTurn.querySelector('.turn-status') : null
    if (row) row.remove()
  }

  function flushReasoning() {
    if (!pendingReasoning) return
    const text = pendingReasoning
    pendingReasoning = ''
    const details = el('details', 'reasoning')
    details.dataset.state = 'done'
    const summary = el('summary')
    const chev = el('span', 'chev')
    const title = el('span', 'row-title', '思考过程')
    const summaryText = el('span', 'row-summary')
    const firstLine = text.trim().split('\n')[0] || ''
    summaryText.textContent = firstLine.slice(0, 120)
    summary.append(chev, title, summaryText)
    const body = el('div', 'reasoning-body', text)
    details.append(summary, body)
    appendToTurn(details)
  }

  function ensureAssistant() {
    if (currentAssistant) return currentAssistant
    flushReasoning()
    const wrap = el('div', 'assistant-msg streaming')
    const body = el('div', 'markdown')
    wrap.appendChild(body)
    currentAssistant = { wrap, body, buffer: '', scheduled: false }
    appendToTurn(wrap)
    return currentAssistant
  }

  function scheduleAssistantRender() {
    const state = currentAssistant
    if (!state || state.scheduled) return
    state.scheduled = true
    requestAnimationFrame(() => {
      state.scheduled = false
      if (currentAssistant !== state) return
      state.body.innerHTML = renderMarkdown(state.buffer)
      if (pinned) scrollBottom()
    })
  }

  function setAssistantText(text, streaming) {
    const state = ensureAssistant()
    state.buffer = text
    state.wrap.classList.toggle('streaming', Boolean(streaming))
    scheduleAssistantRender()
  }

  function finalizeAssistant() {
    flushReasoning()
    if (currentAssistant) {
      currentAssistant.wrap.classList.remove('streaming')
      currentAssistant.body.innerHTML = renderMarkdown(currentAssistant.buffer)
      currentAssistant = null
    }
    currentTool = null
  }

  function appendUserMessage(text, time, kind) {
    ensureTurn()
    const row = el('div', 'user-row')
    const stack = el('div', 'user-stack')
    const bubble = el('div', 'user-bubble' + (kind === 'scene' ? ' scene' : ''), text)
    if (time) bubble.title = new Date(time).toLocaleString()
    stack.appendChild(bubble)
    row.appendChild(stack)
    appendToTurn(row)
    return { row, stack }
  }

  function appendUserImages(content, time) {
    if (!Array.isArray(content)) return
    const images = content.filter(block => block?.type === 'image' && block.attachment?.attachmentId)
    if (images.length === 0) return
    if (!currentTurn) ensureTurn()
    const row = el('div', 'user-row')
    const stack = el('div', 'user-stack')
    const strip = el('div', 'user-images')
    for (const block of images) {
      const img = document.createElement('img')
      img.src = withAuth('/api/attachment/' + encodeURIComponent(block.attachment.attachmentId))
      img.alt = block.attachment.name || '用户图片'
      img.loading = 'lazy'
      img.title = (block.attachment.name || '图片') + ' · ' +
        (block.attachment.width || '?') + '×' + (block.attachment.height || '?')
      img.addEventListener('click', () => openLightbox(img.src))
      strip.appendChild(img)
    }
    stack.appendChild(strip)
    row.appendChild(stack)
    appendToTurn(row)
  }

  function toolTitle(name) {
    const map = {
      bash: '运行命令', pwsh: '运行命令', read: '读取文件', read_image: '读取图片',
      write: '写入文件', edit: '编辑文件', str_replace_editor: '编辑文件',
      grep: '搜索内容', glob: '查找文件', web_search: '搜索网络', web_fetch: '读取网页',
      todo_write: '更新待办', skill: '加载技能', subagent: '调用子代理',
      subagent_fork: '调用子代理', send_message: '发送消息', list_agents: '列出代理',
      workflow: '运行工作流', job_output: '读取后台任务', job_list: '列出后台任务',
      job_kill: '停止后台任务', ask_user_question: '询问用户', plan: '切换计划模式',
      exit_plan_mode: '退出计划模式', schedule_create: '创建定时任务',
      schedule_list: '列出定时任务', schedule_delete: '删除定时任务',
      create_goal: '创建目标', get_goal: '读取目标', update_goal: '更新目标',
      stage_action: '场景指令', vn_command: '场景指令', run_code: '运行代码',
      lsp: '语言服务', memory_save: '保存记忆', memory_search: '检索记忆',
    }
    return map[name] || name
  }

  function parseArgs(args) {
    if (args && typeof args === 'object') return args
    if (typeof args !== 'string') return null
    try {
      const parsed = JSON.parse(args)
      return parsed && typeof parsed === 'object' ? parsed : null
    } catch { return null }
  }

  function toolArgsSummary(name, args) {
    const input = parseArgs(args)
    if (!input || typeof input !== 'object') return ''
    if (name === 'bash' || name === 'pwsh') {
      const cmd = typeof input.command === 'string' ? input.command : ''
      return cmd.replace(/\s+/g, ' ').slice(0, 90)
    }
    if (name === 'read' || name === 'write' || name === 'edit' || name === 'read_image') {
      const file = input.file_path || input.path || input.filePath
      return typeof file === 'string' ? file : ''
    }
    if (name === 'grep' || name === 'glob') {
      const pattern = input.pattern || ''
      const path = input.path || input.glob || ''
      return [pattern, path].filter(Boolean).join(' · ').slice(0, 90)
    }
    if (name === 'web_search') return String(input.query || '').slice(0, 90)
    if (name === 'web_fetch') return String(input.url || '').slice(0, 90)
    if (name === 'str_replace_editor') {
      return [input.command, input.path].filter(Boolean).join(' · ').slice(0, 90)
    }
    if (name === 'stage_action' || name === 'vn_command') {
      return [input.command, input.clientId].filter(Boolean).join(' · ').slice(0, 90)
    }
    const text = (() => { try { return JSON.stringify(input) } catch { return '' } })()
    return text.replace(/\s+/g, ' ').slice(0, 90)
  }

  function toolIcon(name) {
    if (name === 'bash' || name === 'pwsh' || name === 'run_code') {
      return '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6"/><path d="M12 19h8"/></svg>'
    }
    if (name === 'read' || name === 'write' || name === 'edit' || name === 'read_image' || name === 'str_replace_editor') {
      return '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>'
    }
    if (name === 'grep' || name === 'glob') {
      return '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>'
    }
    if (name === 'web_search' || name === 'web_fetch') {
      return '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14 0 18M12 3c-3 3.5-3 14 0 18"/></svg>'

  function appendToolCall(name, args) {
    finalizeAssistant()
    ensureTurn()
    const details = el('details', 'tool-row')
    details.dataset.state = 'running'
    const summary = el('summary')
    const chev = el('span', 'chev')
    const icon = el('span', 'row-icon')
    icon.innerHTML = toolIcon(name)
    const title = el('span', 'row-title', toolTitle(name))
    const sep = el('span', 'row-sep')
    const summaryText = el('span', 'row-summary', toolArgsSummary(name, args))
    const status = el('span', 'row-status', '…')
    summary.append(chev, icon, title, sep, summaryText, status)
    const body = el('div', 'tool-body')
    const argsLabel = el('div', 'result-label', '参数')
    const argsPre = el('pre', '', pretty(args))
    body.append(argsLabel, argsPre)
    details.append(summary, body)
    appendToTurn(details)
    currentTool = { details, name }
    return details
  }

  function completeTool(data) {
    const name = data.name || (currentTool && currentTool.name) || '工具'
    if (!currentTool) appendToolCall(name, {})
    const details = currentTool.details
    const status = details.querySelector('.row-status')
    const summaryText = details.querySelector('.row-summary')
    const body = details.querySelector('.tool-body')
    const isError = Boolean(data.isError)
    details.dataset.state = isError ? 'error' : 'done'
    if (status) status.textContent = isError ? '✕' : '✓'
    const resultText = data.text || (data.content ? contentText(data.content) : '')
    if (resultText) {
      body.appendChild(el('div', 'result-label', isError ? '错误' : '结果'))
      body.appendChild(el('pre', '', resultText))
    }
    const summaryLine = (resultText || '').trim().split('\n')[0]
    if (!summaryText.textContent && summaryLine) summaryText.textContent = summaryLine.slice(0, 90)
    if (isError) details.open = true
    currentTool = null
  }

  function appendStageSpeech(text) {
    ensureTurn()
    appendToTurn(el('div', 'stage-speech', text))
  }

  function appendError(text) {
    ensureTurn()
    appendToTurn(el('div', 'error-row', text))
  }

  function formatSceneEvent(text) {
    let value = null
    try { value = JSON.parse(text) } catch { return text }
    if (!value || typeof value !== 'object') return text
    const kind = value.kind || ''
    switch (kind) {
      case 'user_said': return '🗣️ 玩家说：' + (value.text ?? '')
      case 'assistant_said': return '📢 ' + (value.from ?? '助手') + ' 说：' + (value.text ?? '')
      case 'object_clicked': return '🖱️ 玩家点击了「' + (value.objectId ?? '?') + '」' + (value.description ? ' — ' + value.description : '')
      case 'object_dragged':
      case 'object_moved': return '🖱️ 玩家移动了「' + (value.objectId ?? '?') + '」'
      case 'object_interacted': return '🖱️ 玩家对「' + (value.objectId ?? '?') + '」' + (value.action ? ' · ' + value.action : '') + (value.description ? ' — ' + value.description : '')
      case 'assistant_dragged': return '🖱️ 玩家移动了助手「' + (value.assistantId ?? '?') + '」'
      default: return '🎮 场景事件 · ' + (kind || '未知')
    }
  }

  function formatStageSpeech(name, args) {
    const input = parseArgs(args)
    if (name !== 'stage_action' || !input || input.action !== 'execute') return null
    const command = input.command
    const actionArgs = input.args && typeof input.args === 'object' ? input.args : {}
    const text = typeof actionArgs.text === 'string' ? actionArgs.text.trim() : ''
    if (!text || (command !== 'say' && command !== 'say_to')) return null
    if (command === 'say_to') return '🎭 对 ' + (actionArgs.target || '玩家') + '：' + text
    return '🎭 ' + text
  }

  function systemEventValue(source, key) {
    if (source && source[key] !== undefined && source[key] !== null) return source[key]
    return source && source.task ? source.task[key] : undefined
  }

  function formatSystemTime(value) {
    if (!value) return '未提供'
    const date = new Date(value)
    return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString()
  }

  function formatScheduledTrigger(trigger) {
    const map = { scheduled: '自动到期', manual: '手动唤醒' }
    return map[trigger] || String(trigger || '未提供')
  }

  function appendSystemEvent(data, time) {
    ensureTurn()
    const source = data?.source || {}
    const isTask = source.eventType === 'scheduled-task-triggered' || source.kind === 'scheduled-task'
    const details = el('details', 'event-row')
    const summary = el('summary')
    const chev = el('span', 'chev')
    const title = el('span', 'row-title')
    const summaryText = el('span', 'row-summary')
    title.textContent = isTask ? '系统事件 · 定时任务' : '系统事件'
    summaryText.textContent = isTask
      ? (systemEventValue(source, 'title') || '未命名任务')
      : (source.eventType || '未知事件')
    summary.append(chev, title, summaryText)
    const body = el('div', 'event-body')
    if (isTask) {
      const taskId = systemEventValue(source, 'taskId') || source.task?.id || '未提供'
      const runId = systemEventValue(source, 'runId') || source.run?.id || '未提供'
      const scheduledAt = systemEventValue(source, 'scheduledAt') || source.run?.scheduledAt
      const trigger = source.run?.trigger || source.trigger || '未提供'
      const triggeredAt = source.run?.triggeredAt
      const creatorName = source.task?.creatorName || '未提供'
      const ownerSessionId = source.task?.ownerSessionId || source.sessionId || '未提供'
      const prompt = source.task?.prompt || source.prompt || '未提供'
      const original = plainText(data?.content) || data?.text || ''
      const meta = el('div', 'event-meta')
      meta.textContent = [
        '任务名：' + (systemEventValue(source, 'title') || '未命名任务'),
        '创建人：' + creatorName + ' · ' + ownerSessionId,
        '任务 ID：' + taskId,
        '运行 ID：' + runId,
        '计划时间：' + formatSystemTime(scheduledAt),
        '触发时间：' + formatSystemTime(triggeredAt),
        '触发方式：' + formatScheduledTrigger(trigger),
        'Prompt：' + prompt,
      ].join('\n') + (original && prompt === '未提供' ? '\n原始模型内容：' + original : '')
      body.appendChild(meta)
      body.appendChild(el('pre', '', pretty({ text: data?.text, content: data?.content, source, turn: data?.turn, eventType: data?.eventType })))
    } else {
      body.appendChild(el('pre', '', pretty({ text: data?.text, content: data?.content, source, turn: data?.turn, eventType: data?.eventType })))
    }
    details.append(summary, body)
    if (time) details.title = new Date(time).toLocaleString()
    appendToTurn(details)
  }

  function appendContextInput(text, source, time) {
    ensureTurn()
    const details = el('details', 'context-row')
    const summary = el('summary')
    const chev = el('span', 'chev')
    const kind = source?.kind || 'unknown'
    const label = kind === 'team-message'
      ? '团队通信 · ' + (source?.teamName || source?.fromName || '团队')
      : '上下文注入 · ' + kind + (source?.plugin ? ' / ' + source.plugin : '')
    const preview = el('span', 'row-summary', text.replace(/\s+/g, ' ').slice(0, 100))
    summary.append(chev, el('span', 'row-title', label), preview)
    const body = el('div', 'context-body')
    body.appendChild(el('pre', '', text))
    details.append(summary, body)
    if (time) details.title = new Date(time).toLocaleString()
    appendToTurn(details)
  }

  function appendRawEvent(event) {
    if (!DEBUG) return
    ensureTurn()
    if (!currentRawGroup || currentRawGroup.parentNode !== currentTurn) {
      currentRawEvents = []
      currentRawCounts = {}
      currentRawGroup = el('details', 'raw-row')
      currentRawGroup.append(el('summary'), el('pre'))
      const group = currentRawGroup
      const events = currentRawEvents
      group.addEventListener('toggle', () => {
        if (group.open) group.querySelector('pre').textContent = pretty(events)
      })
      currentTurn.appendChild(currentRawGroup)
    }
    currentRawEvents.push(event)
    const type = event?.type || 'unknown'
    currentRawCounts[type] = (currentRawCounts[type] || 0) + 1
    const counts = Object.entries(currentRawCounts).map(([name, count]) => name + '×' + count).join(' · ')
    currentRawGroup.querySelector('summary').textContent = '原始事件 ' + currentRawEvents.length + ' 条 · ' + counts
    if (currentRawGroup.open) currentRawGroup.querySelector('pre').textContent = pretty(currentRawEvents)
  }

  function endTurn() {
    flushReasoning()
    if (currentAssistant) {
      currentAssistant.wrap.classList.remove('streaming')
      currentAssistant.body.innerHTML = renderMarkdown(currentAssistant.buffer)
      currentAssistant = null
    }
    stopTurnStatus()
    currentTurn = null
    currentTool = null
    currentRawGroup = null
    currentRawEvents = []
    currentRawCounts = {}
    updateToBottom()
  }

  // ── lightbox ──────────────────────────────────────────────────────────────
  function openLightbox(src) {
    $lightboxImg.src = src
    $lightbox.classList.add('visible')
  }
  $lightbox.addEventListener('click', () => $lightbox.classList.remove('visible'))

  // ── image attachments ─────────────────────────────────────────────────────
  function fileAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader()
      reader.onload = () => resolve(reader.result)
      reader.onerror = () => reject(reader.error || new Error('读取图片失败'))
      reader.readAsDataURL(file)
    })
  }

  function renderPendingImages() {
    $attachmentPreview.replaceChildren()
    $attachmentPreview.classList.toggle('visible', pendingImageFiles.length > 0)
    pendingImageFiles.forEach((file, index) => {
      const item = el('div', 'pending-image')
      const img = document.createElement('img')
      const objectUrl = URL.createObjectURL(file)
      img.src = objectUrl
      img.onload = () => URL.revokeObjectURL(objectUrl)
      const remove = document.createElement('button')
      remove.type = 'button'
      remove.textContent = '×'
      remove.title = '移除'
      remove.addEventListener('click', () => {
        pendingImageFiles.splice(index, 1)
        renderPendingImages()
      })
      item.append(img, remove)
      $attachmentPreview.appendChild(item)
    })
    updateSendState()
  }

  function addFiles(files) {
    for (const file of files) {
      if (file && file.type && file.type.startsWith('image/')) pendingImageFiles.push(file)
    }
    renderPendingImages()
  }

  // ── composer ──────────────────────────────────────────────────────────────
  function autoGrow() {
    $input.style.height = 'auto'
    const height = Math.min($input.scrollHeight, 336)
    $input.style.height = height + 'px'
  }

  function updateSendState() {
    const hasText = $input.value.trim().length > 0
    const hasImages = pendingImageFiles.length > 0
    $send.disabled = !httpChannelEnabled || (!hasText && !hasImages)
  }

  function updateComposerHint() {
    if (!httpChannelEnabled) {
      $composerHint.textContent = 'HTTP 通道未启用，仅可查看历史'
      $input.disabled = true
      $attach.disabled = true
      $send.disabled = true
      return
    }
    $input.disabled = false
    $attach.disabled = false
    $composerHint.textContent = ''
  }

  async function sendMessage() {
    if (!httpChannelEnabled) return
    const text = $input.value.trim()
    if (!text && pendingImageFiles.length === 0) return
    $send.disabled = true
    $attach.disabled = true
    try {
      const images = await Promise.all(pendingImageFiles.map(async file => ({
        data: await fileAsDataUrl(file),
        mimeType: file.type,
        name: file.name,
      })))
      const response = await apiFetch('/api/message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, images }),
      })
      const result = await response.json().catch(() => ({}))
      if (!response.ok) throw new Error(result.error || ('HTTP ' + response.status))
      $input.value = ''
      autoGrow()
      pendingImageFiles = []
      $imageInput.value = ''
      renderPendingImages()
    } catch (error) {
      appendError('发送失败：' + (error && error.message ? error.message : String(error)))
    } finally {
      $send.disabled = !httpChannelEnabled
      $attach.disabled = !httpChannelEnabled
      updateSendState()
    }
  }

  // ── observability ─────────────────────────────────────────────────────────
  let statsTimer = null
  async function refreshObservability() {
    try {
      const res = await apiFetch('/api/observability')
      if (!res.ok) return
      const value = await res.json()
      const parts = []
      if (value.turns || value.steps) parts.push(value.turns + ' 轮 · ' + value.steps + ' 步')
      if (value.totalTokens) parts.push('~' + fmtTokens(value.totalTokens) + ' tok')
      if (value.cacheHitRate) parts.push('缓存 ' + Math.round(value.cacheHitRate * 100) + '%')
      if (value.contextWindow) parts.push('上下文 ' + Math.round((value.totalTokens / value.contextWindow) * 100) + '%')
      $stats.textContent = parts.length > 0 ? parts.join(' · ') : '新会话'
      $stats.title = [
        'LLM ' + fmtDuration(value.llmMs) + ' · 工具 ' + fmtDuration(value.toolMs),
        '首 token ' + (value.avgTtftMs > 0 ? (value.avgTtftMs / 1000).toFixed(1) + '秒' : '-') + ' · ' + Math.round(value.tokensPerSecond || 0) + ' tok/s',
        '输入 ' + fmtTokens((value.uncachedInputTokens || 0) + (value.cacheReadTokens || 0) + (value.cacheWriteTokens || 0)) + ' · 输出 ' + fmtTokens(value.outputTokens || 0),
      ].join('\n')
    } catch {
      // 忽略，下次重试
    }
  }

  // ── SSE ───────────────────────────────────────────────────────────────────
  function handleSSEEvent(type, data) {
    switch (type) {
      case 'connected':
        setConnection('connected', '已连接')
        break
      case 'session_event':
        appendRawEvent(data)
        break
      case 'turn_start':
        ensureTurn()
        startTurnStatus()
        setConnection('running', '生成中…')
        break
      case 'scene_event':
        appendUserMessage(formatSceneEvent(data.text || ''), undefined, 'scene')
        break
      case 'team_message':
        appendContextInput(data.text || '', data.source || {}, undefined)
        break
      case 'system_event':
        appendSystemEvent(data)
        break
      case 'model_input': {
        ensureTurn()
        const kind = data.source?.kind || 'unknown'
        const text = plainText(data.content)
        if (kind === 'user') {
          if (text) appendUserMessage(text)
          appendUserImages(data.content)
        } else if (text || contentText(data.content)) {
          appendContextInput(text || contentText(data.content), data.source)
        }
        break
      }
      case 'model_request':
        // 模型请求详情不进入对话流，原始事件已保留在折叠区。
        break
      case 'chunk':
        if (data.kind === 'text-delta' && data.text) {
          const state = ensureAssistant()
          state.buffer += data.text
          scheduleAssistantRender()
        } else if (data.kind === 'reasoning-delta' && data.text) {
          pendingReasoning += data.text
        }
        break
      case 'tool_call': {
        const speech = formatStageSpeech(data.name, data.arguments)
        if (speech) appendStageSpeech(speech)
        appendToolCall(data.name, data.arguments)
        break
      }
      case 'tool_result':
        completeTool(data)
        break
      case 'turn_end':
        endTurn()
        setConnection('connected', '已连接')
        refreshObservability()
        if (activeTab === 'context') refreshContext(true)
        break
      case 'assistant_message': {
        const content = Array.isArray(data.message?.content) ? data.message.content : []
        const reasoning = content.filter(block => block.type === 'reasoning').map(block => block.text || '').join('')
        const text = content.filter(block => block.type === 'text').map(block => block.text || '').join('')
        if (reasoning && !pendingReasoning) pendingReasoning = reasoning
        if (text) setAssistantText(text, false)
        finalizeAssistant()
        break
      }
      default:
        break
    }
  }

  function connectSSE() {
    if (!httpChannelEnabled) return null
    const source = new EventSource(withAuth('/api/stream'))
    source.onopen = () => setConnection('connected', '已连接')
    source.onmessage = event => {
      try {
        const frame = JSON.parse(event.data)
        handleSSEEvent(frame.type, frame.data)
      } catch (error) {
        console.error('SSE parse error:', error)
      }
    }
    source.onerror = () => setConnection('error', '连接断开，重连中…')
    return source
  }

    if (item.feature && CTX_FEATURES[item.feature]) return CTX_FEATURES[item.feature].icon

    return CTX_CATEGORY_ICONS[item.kind] || 'activity'

  function setupTabs() {
    $tabs.addEventListener('click', event => {
      const button = event.target.closest('.tab')
      if (!button) return
      const tab = button.dataset.tab
      switchTab(tab === 'context' ? 'context' : tab === 'swarm' ? 'swarm' : 'chat')
    })
  }

  function switchTab(tab) {
    if (tab === activeTab) return
    activeTab = tab
    for (const button of $tabs.querySelectorAll('.tab')) {
      button.classList.toggle('active', button.dataset.tab === tab)
    }
    $chatView.classList.toggle('active', tab === 'chat')
    $contextView.classList.toggle('active', tab === 'context')
    $swarmView.classList.toggle('active', tab === 'swarm')
    if (tab === 'context') {
      stopSwarmPolling()
      closeSwarmDrawer()
      refreshContext(true)
      $contextScroll.focus({ preventScroll: true })
    } else if (tab === 'swarm') {
      startSwarmPolling()
      refreshSwarm(true)
      $swarmView.focus({ preventScroll: true })
    } else {
      stopSwarmPolling()
      closeSwarmDrawer()
      $input.focus({ preventScroll: true })
      updateToBottom()
      if (pinned) scrollBottom(true)
    }
  }

  async function refreshContext(force = false) {
    if (!force && activeTab !== 'context') return
    if (contextLoading) return
    contextLoading = true
    const previousCount = contextSnapshot === null ? null : contextSnapshot.eventCount
    if (contextSnapshot === null) renderContext()
    try {
      const response = await apiFetch('/api/context')
      if (!response.ok) throw new Error('HTTP ' + response.status)
      const value = await response.json()
      if (!value || typeof value !== 'object' || !Array.isArray(value.groups)) {
        throw new Error('上下文接口返回格式不正确')
      }
      contextSnapshot = value
      contextError = ''
    } catch (error) {
      const message = error && error.message ? error.message : String(error)
      contextError = message.includes('404')
        ? '助手进程还没有加载上下文接口（/api/context）。请重启该助手后再打开此页。'
        : '读取上下文失败：' + message
    } finally {
      contextLoading = false
      const changed = previousCount === null
        || contextSnapshot === null
        || previousCount !== contextSnapshot.eventCount
      if (activeTab === 'context' && (force || changed || contextError.length > 0)) renderContext()
    }
  }

  async function ensureContextNode(id) {
    if (contextNodeCache.has(id) || contextNodeInflight.has(id)) return
    contextNodeInflight.add(id)
    try {
      const response = await apiFetch('/api/context/node?id=' + encodeURIComponent(id))
      if (!response.ok) throw new Error('HTTP ' + response.status)
      const node = await response.json()
      contextNodeCache.set(id, node ?? { error: '无法读取该节点内容' })
    } catch (error) {
      contextNodeCache.set(id, { error: error && error.message ? error.message : String(error) })
    } finally {
      contextNodeInflight.delete(id)
      if (activeTab === 'context') renderContext()
    }
  }

  function emptyNode(message) {
    const node = el('div', 'ctx-empty', message)
    return node
  }

  function ringSvg(percent) {
    const radius = 43
    const circumference = 2 * Math.PI * radius
    const clamped = Math.max(0, Math.min(100, percent))
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
    svg.setAttribute('viewBox', '0 0 106 106')
    svg.setAttribute('width', '106')
    svg.setAttribute('height', '106')
    const track = document.createElementNS('http://www.w3.org/2000/svg', 'circle')
    for (const [key, value] of Object.entries({ cx: 53, cy: 53, r: radius, fill: 'none', stroke: 'var(--hover-solid)', 'stroke-width': 8 })) {
      track.setAttribute(key, String(value))
    }
    const fill = document.createElementNS('http://www.w3.org/2000/svg', 'circle')
    for (const [key, value] of Object.entries({
      cx: 53, cy: 53, r: radius, fill: 'none',
      stroke: clamped >= 85 ? 'var(--danger)' : clamped >= 65 ? 'var(--warn)' : 'var(--accent)',
      'stroke-width': 8, 'stroke-linecap': 'round',
      'stroke-dasharray': (circumference * clamped / 100) + ' ' + circumference,
      transform: 'rotate(-90 53 53)',
    })) {
      fill.setAttribute(key, String(value))
    }
    svg.append(track, fill)
    return svg
  }

  function buildContextOverview(data) {
    const card = el('section', 'ctx-card')
    const body = el('div', 'ctx-overview')

    const top = el('div', 'ctx-overview-top')
    const ring = el('div', 'ctx-ring')
    const percent = data.occupancy?.contextWindow
      ? (data.occupancy.usedTokens / data.occupancy.contextWindow) * 100
      : 0
    ring.appendChild(ringSvg(percent))
    const ringText = el('div', 'ctx-ring-text')
    ringText.append(
      el('div', 'ctx-ring-value', Math.round(percent) + '%'),
      el('div', 'ctx-ring-unit', '上下文已用'),
    )
    ring.appendChild(ringText)
    const current = data.current || {}
    const categorized = Number(current.categorized) || 0
    const model = el('div', 'ctx-model')
    model.append(
      el('div', 'ctx-model-name', (data.model?.provider ?? 'unknown') + ' / ' + (data.model?.model ?? 'unknown')),
      el('div', 'ctx-model-meta', [
        data.occupancy?.contextWindow
          ? fmtTokens(data.occupancy.usedTokens) + ' / ' + fmtTokens(data.occupancy.contextWindow) + ' tok（provider 实际）'
          : fmtTokens(data.occupancy?.usedTokens || 0) + ' tok',
        '分项估算 ~' + fmtTokens(categorized) + ' tok',
        data.occupancy?.remainingTokens !== undefined ? '剩余 ' + fmtTokens(data.occupancy.remainingTokens) + ' tok' : '',
        'max output ' + fmtTokens(data.model?.maxOutputTokens || 0),
      ].filter(Boolean).join(' · ')),
    )
    top.append(ring, model)

    const parts = CTX_CATEGORIES
      .map(item => ({ ...item, value: Number(current[item.key]) || 0 }))
      .filter(item => item.value > 0)

    const bar = el('div', 'ctx-bar')
    const barTotal = parts.reduce((sum, item) => sum + item.value, 0) || 1
    for (const part of parts) {
      const segment = el('span')
      segment.style.width = (part.value / barTotal * 100) + '%'
      segment.style.background = part.color
      segment.title = part.label + ' · ~' + fmtTokens(part.value) + ' tok'
      bar.appendChild(segment)
    }

    const legend = el('div', 'ctx-legend')
    for (const part of parts) {
      const row = el('div', 'ctx-legend-row')
      const swatch = el('span', 'ctx-swatch')
      swatch.style.background = part.color
      const categoryIcon = ctxIcon(CTX_CATEGORY_ICONS[part.key] || 'activity', 13)
      categoryIcon.style.color = part.color
      row.append(swatch, categoryIcon, el('span', 'ctx-legend-label', part.label), el('span', 'ctx-legend-tokens', '~' + fmtTokens(part.value)))
      legend.appendChild(row)
    }

    const note = el('div', 'ctx-note', '组成分项来自 dsh token-meter 启发式估算（~）；占用环与百分比为 provider 上报的实际 prompt token。')
    const tokens = data.tokens || {}
    const inputTokens = (tokens.uncachedInput || 0) + (tokens.cacheRead || 0) + (tokens.cacheWrite || 0)
    const kpis = el('div', 'ctx-kpis')
    const addKpi = (label, value, title, iconName) => {
      const item = el('div', 'ctx-kpi')
      const labelRow = el('div', 'ctx-kpi-label')
      if (iconName) labelRow.appendChild(ctxIcon(iconName, 12))
      labelRow.appendChild(el('span', '', label))
      item.append(el('div', 'ctx-kpi-value', value), labelRow)
      if (title) item.title = title
      kpis.appendChild(item)
    }
    addKpi('请求数', String(data.stats?.requests ?? 0), undefined, 'output')
    addKpi('压缩 / 剪枝', (data.stats?.compactions ?? 0) + ' / ' + (data.stats?.prunes ?? 0), undefined, 'compact')
    addKpi('模型切换', String(data.stats?.modelSwitches ?? 0), undefined, 'stage')
    addKpi('工具结果', String(data.stats?.toolResults ?? 0), undefined, 'tool')
    addKpi('技能注入', String(data.stats?.skills ?? 0), undefined, 'skill')
    addKpi('累计输入 tok', fmtTokens(inputTokens), '整段会话累计：非缓存 + 缓存读 + 缓存写', 'user')
    addKpi('累计输出 tok', fmtTokens(tokens.output || 0), undefined, 'assistant')
    addKpi('缓存命中', Math.round((tokens.cacheHitRate || 0) * 100) + '%', undefined, 'activity')

    body.append(top, bar, legend, note, kpis)
    card.appendChild(body)
    return card
  }

  function contextItemBody(item) {
    const wrapper = el('div', 'ctx-item-body')
    const node = contextNodeCache.get(item.id)
    if (node === undefined) {
      wrapper.appendChild(el('div', 'ctx-item-loading', '加载完整内容…'))
      ensureContextNode(item.id)
      return wrapper
    }
    if (node.error) {
      wrapper.appendChild(el('div', 'ctx-item-loading ctx-error', '读取失败：' + node.error))
      return wrapper
    }
    wrapper.appendChild(el('pre', '', node.text || '(空内容)'))
    if (node.truncated) wrapper.appendChild(el('div', 'ctx-item-loading', '内容过长，已截断显示。'))
    if (node.raw !== undefined && node.raw !== null) {
      const raw = el('details', 'ctx-raw')
      raw.append(el('summary', '', '原始 JSON'), el('pre', '', pretty(node.raw)))
      wrapper.appendChild(raw)
    }
    return wrapper
  }

  function contextCategoryColor(key) {
    const found = CTX_CATEGORIES.find(item => item.key === key)
    return found ? found.color : 'var(--text-3)'
  }

  function contextTotals(data) {
    const groups = Array.isArray(data.groups) ? data.groups : []
    const byCategory = {}
    let total = 0
    for (const group of groups) {
      const count = (Array.isArray(group.items) ? group.items.length : 0) + (group.dropped || 0)
      byCategory[group.key] = count
      total += count
    }
    return { byCategory, total }
  }

  function visibleContextGroups(data) {
    const needle = contextSearch.trim().toLowerCase()
    return (Array.isArray(data.groups) ? data.groups : []).map(group => {
      if (contextFilter !== 'all' && group.key !== contextFilter) return { ...group, items: [] }
      let items = (Array.isArray(group.items) ? group.items : []).filter(item => {
        if (needle.length === 0) return true
        const haystack = [item.title, item.subtitle, item.preview, item.feature ? CTX_FEATURES[item.feature]?.label : '']
          .filter(Boolean).join(' ').toLowerCase()
        return haystack.includes(needle)
      })
      if (contextSort === 'size') items = [...items].sort((left, right) => (right.tokens || 0) - (left.tokens || 0))
      return { ...group, items }
    })
  }

  function contextMini(title, iconName, rows) {
    const box = el('div', 'ctx-mini')

    box.appendChild(head)
    for (const row of rows) {

      if (row.icon) line.appendChild(ctxIcon(row.icon, 13))
      line.append(el('span', '', row.label), el('b', '', String(row.value ?? 0)))
      if (row.onClick) {
        line.style.cursor = 'pointer'
        line.addEventListener('click', row.onClick)
      }
      box.appendChild(line)
    }
    return box
  }

  function buildContextTokenTiming(data) {
    const grid = el('div', 'ctx-grid2')
    const tokens = data.tokens || {}
    const timing = data.timing || {}
    const inputTokens = (tokens.uncachedInput || 0) + (tokens.cacheRead || 0) + (tokens.cacheWrite || 0)
    const outputTokens = tokens.output || 0
    const totalTokens = inputTokens + outputTokens

    const tokenCard = el('section', 'ctx-card')
    const tokenHead = el('div', 'ctx-card-head')
    tokenHead.append(el('div', 'ctx-card-title', 'Token 统计'), el('div', 'ctx-card-sub', '整段会话累计'))
    const tokenBody = el('div', 'ctx-panel-body')
    tokenBody.append(
      el('div', 'ctx-big', fmtTokens(totalTokens) + ' tok'),
      el('div', 'ctx-sub', '输入 ' + fmtTokens(inputTokens) + ' · 输出 ' + fmtTokens(outputTokens) + ' · 缓存命中 ' + Math.round((tokens.cacheHitRate || 0) * 100) + '%'),
    )
    const split = el('div', 'ctx-split-bar')
    if (totalTokens > 0) {
      const inputPart = el('span')
      inputPart.style.width = (inputTokens / totalTokens * 100) + '%'
      inputPart.style.background = 'var(--ctx-user)'
      inputPart.title = '输入 ' + fmtTokens(inputTokens)
      const outputPart = el('span')
      outputPart.style.width = (outputTokens / totalTokens * 100) + '%'
      outputPart.style.background = 'var(--ctx-assistant)'
      outputPart.title = '输出 ' + fmtTokens(outputTokens)
      split.append(inputPart, outputPart)
    }
    tokenBody.appendChild(split)
    const tokenLegend = el('div', 'ctx-legend-line')
    tokenLegend.append(
      el('span', '', '缓存读 ' + fmtTokens(tokens.cacheRead || 0)),
      el('span', '', '缓存写 ' + fmtTokens(tokens.cacheWrite || 0)),
      el('span', '', '非缓存 ' + fmtTokens(tokens.uncachedInput || 0)),
    )
    tokenBody.appendChild(tokenLegend)
    tokenCard.append(tokenHead, tokenBody)

    const timingCard = el('section', 'ctx-card')
    const timingHead = el('div', 'ctx-card-head')
    timingHead.append(el('div', 'ctx-card-title', '耗时统计'), el('div', 'ctx-card-sub', '本次会话累计'))
    const timingBody = el('div', 'ctx-panel-body')
    const llmMs = timing.llmMs || 0
    const toolMs = timing.toolMs || 0
    const ttftMs = timing.ttftMs || 0
    const decodeMs = timing.decodeMs || 0
    const otherMs = Math.max(0, llmMs - ttftMs - decodeMs)
    const parts = [
      { label: '模型等待', icon: 'clock', value: ttftMs, color: 'var(--ctx-inject)' },
      { label: '模型生成', icon: 'assistant', value: decodeMs, color: 'var(--ctx-assistant)' },
      { label: '模型其他', icon: 'activity', value: otherMs, color: 'var(--ctx-system)' },
      { label: '工具执行', icon: 'tool', value: toolMs, color: 'var(--ctx-tool)' },
    ]
    const activeMs = llmMs + toolMs
    timingBody.append(
      el('div', 'ctx-big', activeMs > 0 ? fmtDuration(activeMs) : '0s'),
      el('div', 'ctx-sub', '活跃时长 = 模型调用 + 工具执行'),
    )
    const timeBar = el('div', 'ctx-split-bar')
    if (activeMs > 0) {
      for (const part of parts) {
        if (part.value <= 0) continue
        const segment = el('span')
        segment.style.width = (part.value / activeMs * 100) + '%'
        segment.style.background = part.color
        segment.title = part.label + ' ' + fmtDuration(part.value)
        timeBar.appendChild(segment)
      }
    }
    timingBody.appendChild(timeBar)
    const timingLegend = el('div', 'ctx-legend-line')
    for (const part of parts) {
      const item = el('span')
      const swatch = el('span', 'ctx-swatch')
      swatch.style.background = part.color
      item.append(swatch, el('span', '', part.label + ' ' + fmtDuration(part.value) + '（' + (activeMs > 0 ? Math.round(part.value / activeMs * 100) : 0) + '%）'))
      timingLegend.appendChild(item)
    }
    timingBody.appendChild(timingLegend)
    const speed = el('div', 'ctx-legend-line')
    speed.append(
      el('span', '', '输出速度 ' + Math.round(timing.tokensPerSecond || 0) + ' tok/s'),
      el('span', '', '平均首 token ' + (timing.avgTtftMs > 0 ? (timing.avgTtftMs / 1000).toFixed(1) + '秒' : '-')),
    )
    timingBody.appendChild(speed)
    timingCard.append(timingHead, timingBody)

    grid.append(tokenCard, timingCard)
    return grid
  }

  function buildContextBrowser(data) {
    const card = el('section', 'ctx-card')
    card.id = 'ctx-browser'

    const head = el('div', 'ctx-card-head')

    titleWrap.append(

    const search = document.createElement('input')

    const sortButton = el('button', 'ctx-btn', contextSort === 'size' ? '排序：Token↓' : '排序：顺序')

    const expandGroups = el('button', 'ctx-btn', '展开分组')

    expandGroups.addEventListener('click', () => {

      renderContext()
    })
    const collapseGroups = el('button', 'ctx-btn', '折叠分组')
    collapseGroups.type = 'button'
    collapseGroups.addEventListener('click', () => {
