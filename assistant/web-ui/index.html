    })
    const expandItems = el('button', 'ctx-btn', '展开条目')
    expandItems.type = 'button'
    expandItems.addEventListener('click', () => {
      for (const group of visibleContextGroups(data)) {
        for (const item of group.items) {
          contextExpanded.add(item.id)
          ensureContextNode(item.id)
        }
      }
      renderContext()
    })
    const collapseItems = el('button', 'ctx-btn', '收起条目')
    collapseItems.type = 'button'
    collapseItems.addEventListener('click', () => {
      contextExpanded = new Set()
      renderContext()
    })
    filterRow.append(sortButton, expandGroups, collapseGroups, expandItems, collapseItems)
    card.appendChild(filterRow)

    const groupsWrap = el('div')
    let visibleCount = 0
    for (const group of visibleContextGroups(data)) {
      const activeSearch = contextSearch.trim().length > 0
      if (group.items.length === 0 && (activeSearch || contextFilter !== 'all')) continue
      visibleCount += group.items.length
      const details = el('details', 'ctx-group')
      details.dataset.group = group.key
      if (contextOpenGroups.has(group.key)) details.open = true
      const summary = el('summary')
      const chev = el('span', 'ctx-group-chev')
      const icon = ctxIcon(CTX_CATEGORY_ICONS[group.key] || 'activity', 14)
      icon.style.color = contextCategoryColor(group.key)
      summary.append(
        chev,
        icon,
        el('span', 'ctx-group-name', CTX_GROUP_LABELS[group.key] || group.label || group.key),
        el('span', 'ctx-group-count', group.items.length + ' 项'),
        el('span', 'ctx-group-tokens', '~' + fmtTokens(group.tokens || 0) + ' tok'),
      )
      details.appendChild(summary)
      if (group.items.length > 0) {
        const container = el('div', 'ctx-items')
        for (const item of group.items) {
          const expanded = contextExpanded.has(item.id)
          const row = el('div', 'ctx-item')
          row.dataset.id = item.id
          if (expanded) row.classList.add('expanded')
          const line = el('div', 'ctx-item-row')
          const itemIcon = ctxIcon(itemIconFor(item), 14, 'ctx-item-ic')
          if (item.feature) itemIcon.style.color = 'var(--feat-' + item.feature + ')'
          line.append(itemIcon, el('span', 'ctx-item-title', item.title || '上下文'))
          const badge = item.feature ? featureBadge(item.feature) : null
          if (badge) line.appendChild(badge)
          line.append(
            el('span', 'ctx-item-preview', item.preview || item.subtitle || ''),
            el('span', 'ctx-item-tokens', '~' + fmtTokens(item.tokens || 0)),
            el('span', 'ctx-item-caret'),
          )
          line.addEventListener('click', () => {
            if (contextExpanded.has(item.id)) {
              contextExpanded.delete(item.id)
              renderContext()
            } else {
              contextExpanded.add(item.id)
              ensureContextNode(item.id)
              renderContext()
            }
          })
          row.appendChild(line)
          if (expanded) row.appendChild(contextItemBody(item))
          container.appendChild(row)
        }
        details.appendChild(container)
      }
      if ((group.dropped || 0) > 0) {
        details.appendChild(el('div', 'ctx-item-loading', '另有 ' + group.dropped + ' 项更早的内容已省略（单组上限 600 项）'))
      }
      groupsWrap.appendChild(details)
    }
    if (visibleCount === 0) {
      groupsWrap.appendChild(emptyNode(contextSearch.trim().length > 0 || contextFilter !== 'all'
        ? '没有匹配当前筛选条件的上下文内容。'
        : '当前会话还没有上下文内容。发送一条消息后，模型真正看到的系统提示词、工具、消息和工具结果会出现在这里。'))
    }
    card.append(groupsWrap)
    return card
  }

  function trendSeries(data) {
    const requests = Array.isArray(data.requests) ? data.requests : []
    if (contextTrendGranularity === 'turn') {
      const byTurn = new Map()
      for (const request of requests) {
        const turn = request.turn ?? '?'
        let entry = byTurn.get(turn)
        if (entry === undefined) {
          entry = {
            turn, count: 0, prompt: 0, output: 0, cacheRead: 0,
            step: request.step, userText: request.userText, assistantText: request.assistantText,
            time: request.time,
          }
          byTurn.set(turn, entry)
        }
        entry.count += 1
        entry.prompt = request.prompt || 0
        entry.output += request.output || 0
        entry.cacheRead += request.cacheRead || 0
        entry.step = request.step
        entry.time = request.time
        if (request.userText) entry.userText = request.userText
        if (request.assistantText) entry.assistantText = request.assistantText
      }
      return [...byTurn.values()].sort((left, right) => Number(left.turn) - Number(right.turn)).slice(-120)
    }
    return requests.slice(-120).map(request => ({ ...request, count: 1 }))
  }

  function buildContextTrend(data) {
    const series = trendSeries(data)
    if (series.length === 0) return null
    const deltas = series.map((point, index) => (point.prompt || 0) - (index > 0 ? (series[index - 1].prompt || 0) : 0))
    const card = el('section', 'ctx-card')
    card.id = 'ctx-trend'
    const head = el('div', 'ctx-card-head')
    head.append(
      el('div', 'ctx-card-title', '上下文趋势'),
      el('div', 'ctx-card-sub', contextTrendGranularity === 'turn' ? '按轮次聚合，实际 prompt/output' : '按请求（step）展示，实际 prompt/output'),
    )
    const toolbar = el('div', 'ctx-trend-toolbar')
    const granularityChips = el('div', 'ctx-chips')
    for (const [key, label] of [['step', '步骤'], ['turn', '轮次']]) {
      const chip = el('button', 'ctx-chip' + (contextTrendGranularity === key ? ' active' : ''), label)
      chip.type = 'button'
      chip.addEventListener('click', () => { contextTrendGranularity = key; contextTrendSelection = null; renderContext() })
      granularityChips.appendChild(chip)
    }
    const modeChips = el('div', 'ctx-chips')
    for (const [key, label] of [['total', '总量'], ['delta', '增量']]) {
      const chip = el('button', 'ctx-chip' + (contextTrendMode === key ? ' active' : ''), label)
      chip.type = 'button'
      chip.addEventListener('click', () => { contextTrendMode = key; contextTrendSelection = null; renderContext() })
      modeChips.appendChild(chip)
    }
    toolbar.append(granularityChips, modeChips)
    head.appendChild(toolbar)

    const wrap = el('div', 'ctx-chart-wrap')
    const width = 900
    const height = 210
    const padLeft = 52
    const padRight = 10
    const padTop = 12
    const padBottom = 26
    const plotWidth = width - padLeft - padRight
    const plotHeight = height - padTop - padBottom
    const slot = plotWidth / series.length
    const barWidth = Math.max(1, Math.min(9, slot * 0.6))

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
    svg.setAttribute('class', 'ctx-chart')
    svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height)
    svg.setAttribute('preserveAspectRatio', 'none')

    const addGridLine = (y, label, x = padLeft) => {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line')
      for (const [key, value] of Object.entries({ x1: padLeft, x2: width - padRight, y1: y, y2: y })) line.setAttribute(key, String(value))
      line.setAttribute('class', 'grid')
      svg.appendChild(line)
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text')
      text.setAttribute('x', String(x - 6))
      text.setAttribute('y', String(y + 3))
      text.setAttribute('text-anchor', 'end')
      text.textContent = label
      svg.appendChild(text)
    }

    if (contextTrendMode === 'delta') {
      const maxAbs = Math.max(1, ...deltas.map(value => Math.abs(value)))
      const niceAbs = Math.max(100, Math.ceil(maxAbs / 1000) * 1000)
      const baseline = padTop + plotHeight / 2
      addGridLine(padTop, '+' + fmtTokens(niceAbs))
      addGridLine(baseline, '0')
      addGridLine(padTop + plotHeight, '-' + fmtTokens(niceAbs))
      deltas.forEach((delta, index) => {
        if (delta === 0) return
        const x = padLeft + slot * index + (slot - barWidth) / 2
        const barHeight = Math.abs(delta) / niceAbs * (plotHeight / 2)
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect')
        rect.setAttribute('x', String(x))
        rect.setAttribute('y', String(delta >= 0 ? baseline - barHeight : baseline))
        rect.setAttribute('width', String(barWidth))
        rect.setAttribute('height', String(barHeight))
        rect.setAttribute('fill', delta >= 0 ? 'var(--ctx-user)' : 'var(--danger)')
        if (contextTrendSelection === index) {
          rect.setAttribute('stroke', 'var(--text)')
          rect.setAttribute('stroke-width', '1.5')
        }
        const title = document.createElementNS('http://www.w3.org/2000/svg', 'title')
        title.textContent = '#' + (index + 1) + (series[index].turn !== undefined ? ' · 第 ' + series[index].turn + ' 轮' : '') +
          ' · prompt ' + (delta >= 0 ? '+' : '') + fmtTokens(delta)
        rect.appendChild(title)
        rect.style.cursor = 'pointer'
        rect.addEventListener('click', () => { contextTrendSelection = index; renderContext() })
        svg.appendChild(rect)
      })
    } else {
      const totals = series.map(point => (point.prompt || 0) + (point.output || 0))
      const maxValue = Math.max(1, ...totals)
      const niceMax = Math.max(1000, Math.ceil(maxValue / 1000) * 1000)
      addGridLine(padTop, fmtTokens(niceMax))
      addGridLine(padTop + plotHeight / 2, fmtTokens(Math.round(niceMax / 2)))
      addGridLine(padTop + plotHeight, '0')
      series.forEach((point, index) => {
        const prompt = point.prompt || 0
        const output = point.output || 0
        const x = padLeft + slot * index + (slot - barWidth) / 2
        const promptHeight = prompt / niceMax * plotHeight
        const outputHeight = output / niceMax * plotHeight
        const outputRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect')
        outputRect.setAttribute('x', String(x))
        outputRect.setAttribute('y', String(padTop + plotHeight - promptHeight - outputHeight))
        outputRect.setAttribute('width', String(barWidth))
        outputRect.setAttribute('height', String(outputHeight))
        outputRect.setAttribute('class', 'bar-output')
        const promptRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect')
        promptRect.setAttribute('x', String(x))
        promptRect.setAttribute('y', String(padTop + plotHeight - promptHeight))
        promptRect.setAttribute('width', String(barWidth))
        promptRect.setAttribute('height', String(promptHeight))
        promptRect.setAttribute('class', 'bar-prompt')
        const title = document.createElementNS('http://www.w3.org/2000/svg', 'title')
        title.textContent = '#' + (index + 1) + (point.turn !== undefined ? ' · 第 ' + point.turn + ' 轮' : '') +
          (point.step !== undefined ? ' / step ' + point.step : '') +
          ' · prompt ' + fmtTokens(prompt) + ' · output ' + fmtTokens(output) + ' · cache ' + fmtTokens(point.cacheRead || 0)
        outputRect.appendChild(title)
        for (const rect of [promptRect, outputRect]) {
          if (contextTrendSelection === index) {
            rect.setAttribute('stroke', 'var(--text)')
            rect.setAttribute('stroke-width', '1.5')
          }
          rect.style.cursor = 'pointer'
          rect.addEventListener('click', () => { contextTrendSelection = index; renderContext() })
        }
        svg.append(outputRect, promptRect)
      })
    }

    const firstLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text')
    firstLabel.setAttribute('x', String(padLeft))
    firstLabel.setAttribute('y', String(height - 8))
    firstLabel.textContent = contextTrendGranularity === 'turn' && series[0].turn !== undefined ? '第 ' + series[0].turn + ' 轮' : '最早请求'
    const lastLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text')
    lastLabel.setAttribute('x', String(width - padRight))
    lastLabel.setAttribute('y', String(height - 8))
    lastLabel.setAttribute('text-anchor', 'end')
    const last = series[series.length - 1]
    lastLabel.textContent = contextTrendGranularity === 'turn' && last.turn !== undefined ? '第 ' + last.turn + ' 轮' : '最新请求'
    svg.append(firstLabel, lastLabel)
    wrap.appendChild(svg)

    const legend = el('div', 'ctx-chart-legend')
    const promptLegend = el('span')
    const promptSwatch = el('span', 'ctx-swatch')
    promptSwatch.style.background = 'var(--ctx-user)'
    promptLegend.append(promptSwatch, el('span', '', contextTrendMode === 'delta' ? 'prompt 增量' : 'prompt（实际输入）'))
    if (contextTrendMode === 'total') {
      const outputLegend = el('span')
      const outputSwatch = el('span', 'ctx-swatch')
      outputSwatch.style.background = 'var(--ctx-assistant)'
      outputLegend.append(outputSwatch, el('span', '', 'output'))
      legend.append(promptLegend, outputLegend)
    } else {
      legend.append(promptLegend)
    }

    const detail = el('div', 'ctx-trend-detail')
    if (contextTrendSelection !== null && series[contextTrendSelection] !== undefined) {
      const point = series[contextTrendSelection]
      detail.append(el('div', 'ctx-trend-detail-title', contextTrendGranularity === 'turn'
        ? '第 ' + point.turn + ' 轮（' + point.count + ' 次请求）'
        : '第 ' + (point.turn ?? '?') + ' 轮 · 第 ' + (point.step ?? '?') + ' 步'))
      if (point.userText) {
        const row = el('div', 'ctx-trend-row')
        row.append(el('span', 'label', '本轮'), el('span', 'value', point.userText))
        detail.appendChild(row)
      }
      const numbers = el('div', 'ctx-trend-row')
      numbers.append(el('span', 'label', '输入'), el('span', 'value num', fmtTokens(point.prompt || 0) + ' tok · output ' + fmtTokens(point.output || 0) + ' tok · 缓存读 ' + fmtTokens(point.cacheRead || 0)))
      detail.appendChild(numbers)
      if (point.assistantText) {
        const row = el('div', 'ctx-trend-row')
        row.append(el('span', 'label', '回复'), el('span', 'value', point.assistantText))
        detail.appendChild(row)
      }
      const hint = el('div', 'ctx-sub', '点击图上的柱子可切换请求；再次点击同一项保持不变。')
      detail.appendChild(hint)
    } else {
      detail.appendChild(el('div', 'ctx-sub', '点击任意柱子查看该请求的轮次 / 输入 / 回复。'))
    }
    card.append(head, wrap, legend, detail)
    return card
  }

  function buildContextEvents(data) {
    const all = Array.isArray(data.events) ? data.events : []
    if (all.length === 0) return null
    const counts = data.eventCounts || {}
    const card = el('section', 'ctx-card')
    card.id = 'ctx-events'
    const head = el('div', 'ctx-card-head')
    head.append(
      el('div', 'ctx-card-title', '上下文事件'),
      el('div', 'ctx-card-sub', '压缩 / 剪枝 / 模型切换 / 计划模式 / 注入；点击注入可定位到上方条目'),
    )
    card.appendChild(head)

    const filters = el('div', 'ctx-event-filters')
    const addFilter = (key, label, count) => {
      const chip = el('button', 'ctx-chip' + (contextEventFilter === key ? ' active' : ''), label + ' ' + count)
      chip.type = 'button'
      chip.addEventListener('click', () => { contextEventFilter = key; renderContext() })
      filters.appendChild(chip)
    }
    addFilter('all', '全部', all.length)
    for (const key of ['inject', 'compaction', 'prune', 'model', 'mode']) {
      addFilter(key, CTX_EVENT_KINDS[key] || key, counts[key] ?? 0)
    }
    card.appendChild(filters)

    const list = el('div', 'ctx-events')
    const events = contextEventFilter === 'all' ? all : all.filter(event => event.kind === contextEventFilter)
    if (events.length === 0) {
      list.appendChild(emptyNode('当前筛选下没有事件。'))
    }
    for (const event of events) {
      const row = el('div', 'ctx-event' + (event.itemId ? ' clickable' : ''))
      const icon = ctxIcon(CTX_EVENT_ICONS[event.kind] || 'activity', 14)
      const badge = el('span', 'ctx-event-badge kind-' + (event.kind || 'inject'), CTX_EVENT_KINDS[event.kind] || event.kind || '事件')
      const main = el('div', 'ctx-event-main')
      main.appendChild(el('div', 'ctx-event-label', event.label || ''))
      if (event.detail) main.appendChild(el('div', 'ctx-event-detail', event.detail))
      const meta = el('div', 'ctx-event-meta')
      meta.textContent = [
        event.time ? new Date(event.time).toLocaleTimeString() : '',
        event.tokens ? '~' + fmtTokens(event.tokens) + ' tok' : '',
      ].filter(Boolean).join(' · ')
      row.append(icon, badge, main, meta)
      if (event.itemId) {
        row.addEventListener('click', () => {
          contextFilter = 'all'
          contextSearch = ''
          contextExpanded.add(event.itemId)
          ensureContextNode(event.itemId)
          pendingScrollItemId = event.itemId
          renderContext()
        })
      }
      list.appendChild(row)
    }
    card.appendChild(list)
    return card
  }

  function buildContextFiles(data) {
    const files = Array.isArray(data.files) ? data.files : []
    if (files.length === 0) return null
    const card = el('section', 'ctx-card')
    card.id = 'ctx-files'
    const head = el('div', 'ctx-card-head')
    const titleWrap = el('div')
    titleWrap.append(
      el('div', 'ctx-card-title', '文件活动'),
      el('div', 'ctx-card-sub', files.length + ' 个文件 · 读取 / 写入 / 搜索 / 图片与行数变化'),
    )
    const search = document.createElement('input')
    search.id = 'ctx-file-search'
    search.className = 'ctx-search'
    search.placeholder = '按路径过滤…'
    search.value = contextFileSearch
    search.addEventListener('input', () => { contextFileSearch = search.value; renderContext() })
    head.append(titleWrap, search)
    card.appendChild(head)

    const filters = el('div', 'ctx-event-filters')
    const counts = {
      all: files.length,
      read: files.filter(file => file.reads > 0).length,
      write: files.filter(file => file.writes > 0).length,
      search: files.filter(file => file.searches > 0).length,
      image: files.filter(file => file.images > 0).length,
    }
    const addFilter = (key, label) => {
      const chip = el('button', 'ctx-chip' + (contextFileFilter === key ? ' active' : ''), label + ' ' + counts[key])
      chip.type = 'button'
      chip.addEventListener('click', () => { contextFileFilter = key; renderContext() })
      filters.appendChild(chip)
    }
    addFilter('all', '全部')
    addFilter('read', '读取')
    addFilter('write', '写入')
    addFilter('search', '搜索')
    addFilter('image', '图片')
    card.appendChild(filters)

    const needle = contextFileSearch.trim().toLowerCase()
    const rows = files.filter(file => {
      if (contextFileFilter === 'read' && file.reads === 0) return false
      if (contextFileFilter === 'write' && file.writes === 0) return false
      if (contextFileFilter === 'search' && file.searches === 0) return false
      if (contextFileFilter === 'image' && file.images === 0) return false
      return needle.length === 0 || file.path.toLowerCase().includes(needle)
    })
    const list = el('div', 'ctx-files')
    if (rows.length === 0) list.appendChild(emptyNode('当前筛选下没有文件活动。'))
    for (const file of rows) {
      const row = el('div', 'ctx-file')
      const ops = el('div', 'ctx-file-ops')
      if (file.reads > 0) ops.append(ctxIcon('file', 13), el('span', '', String(file.reads)))
      if (file.writes > 0) ops.append(ctxIcon('write', 13), el('span', '', String(file.writes)))
      if (file.searches > 0) ops.append(ctxIcon('search', 13), el('span', '', String(file.searches)))
      if (file.images > 0) ops.append(ctxIcon('image', 13), el('span', '', String(file.images)))
      const delta = el('div', 'ctx-file-delta')
      if (file.added > 0) delta.appendChild(el('span', 'add', '+' + file.added))
      if (file.removed > 0) delta.appendChild(el('span', 'del', '-' + file.removed))
      const meta = el('div', 'ctx-file-meta', file.lastTime ? new Date(file.lastTime).toLocaleString() : '')
      row.append(ctxIcon('file', 14), el('div', 'ctx-file-path', file.path), ops, delta, meta)
      list.appendChild(row)
    }
    card.appendChild(list)
    return card
  }

  function renderContext() {
    if (activeTab !== 'context') return
    const previousScroll = $contextScroll.scrollTop
    const activeElement = document.activeElement
    const focusId = activeElement !== null ? activeElement.id : ''
    const searchFocused = focusId === 'ctx-search' || focusId === 'ctx-file-search'
    const selectionStart = searchFocused ? activeElement.selectionStart : null
    $contextInner.replaceChildren()
    if (contextSnapshot === null) {
      $contextInner.appendChild(emptyNode(contextLoading
        ? '正在读取上下文…'
        : contextError || '正在读取上下文…'))
      return
    }
    $contextInner.append(
      buildContextStats(contextSnapshot),
      buildContextTokenTiming(contextSnapshot),
      buildContextOverview(contextSnapshot),
      buildContextBrowser(contextSnapshot),
    )
    const trend = buildContextTrend(contextSnapshot)
    if (trend) $contextInner.appendChild(trend)
    const events = buildContextEvents(contextSnapshot)
    if (events) $contextInner.appendChild(events)
    const files = buildContextFiles(contextSnapshot)
    if (files) $contextInner.appendChild(files)
    if (contextError.length > 0) {
      const banner = el('div', 'ctx-card')
      banner.appendChild(el('div', 'ctx-empty ctx-error', contextError))
      $contextInner.appendChild(banner)
    }
    $contextScroll.scrollTop = previousScroll
    if (searchFocused) {
      const search = document.getElementById(focusId)
      if (search) {
        search.focus({ preventScroll: true })
        if (selectionStart !== null) search.setSelectionRange(selectionStart, selectionStart)
      }
    }
    if (pendingScrollCardId) {
      const target = document.getElementById(pendingScrollCardId)
      if (target) target.scrollIntoView({ block: 'start' })
      pendingScrollCardId = null
    }
    if (pendingScrollItemId) {
      const row = [...document.querySelectorAll('.ctx-item')].find(item => item.dataset.id === pendingScrollItemId)
      if (row) row.scrollIntoView({ block: 'center' })
      pendingScrollItemId = null
    }
  }

  function installContextEvents() {
    $contextInner.addEventListener('toggle', event => {
      const details = event.target
      if (!(details instanceof HTMLElement) || !details.classList.contains('ctx-group')) return
      const key = details.dataset.group
      if (!key) return
      if (details.open) contextOpenGroups.add(key)
      else contextOpenGroups.delete(key)
    }, true)
    if (contextPollTimer) clearInterval(contextPollTimer)
    contextPollTimer = setInterval(() => {
      if (activeTab === 'context' && !document.hidden) refreshContext()
    }, 5000)
  }

  // ── status + history ──────────────────────────────────────────────────────
  async function loadStatus() {
    const response = await apiFetch('/api/status')
    if (!response.ok) throw new Error('读取助手状态失败: HTTP ' + response.status)
    const status = await response.json()
    if (status.name) {
      $title.textContent = status.name
      document.title = status.name
    }
    if (status.model) {
      $modelChip.hidden = false
      $modelChip.textContent = status.model
      $modelChip.title = (status.provider ? status.provider + ' / ' : '') + status.model
    }
    if (Array.isArray(status.channelEndpoints)) {
      const endpoint = status.channelEndpoints.find(item => item.id === 'http' && item.protocol === 'http')
      httpChannelEnabled = Boolean(endpoint)
      if (endpoint && !API_BASE) {
        const target = new URL(location.origin)
        target.port = String(endpoint.port)
        httpInteractionBase = target.origin
      }
    }
    updateComposerHint()
    updateSendState()
    return status
  }

  function resetFlow() {
    $messages.replaceChildren()
    currentTurn = null
    currentAssistant = null
    currentTool = null
    currentRawGroup = null
    currentRawEvents = []
    currentRawCounts = {}
    pendingReasoning = ''
    turnParent = null
    stopTurnStatus()
    setEmpty(true)
  }

  function renderHistoricalEvent(event) {
    appendRawEvent(event)
    const data = event.data || {}
    switch (event.type) {
      case 'turn/start':
        ensureTurn()
        break
      case 'user/message': {
        const kind = data.source?.kind
        if (kind === 'event' || kind === 'stage-event') {
          const text = plainText(data.content).trim()
          if (text) appendUserMessage(formatSceneEvent(text), event.time, 'scene')
          break
        }
        if (kind === 'system-event' || kind === 'scheduled-task') {
          appendSystemEvent({ text: contentText(data.content), content: data.content || [], source: data.source || {}, turn: data.turn, eventType: data.source?.eventType }, event.time)
          break
        }
        if (kind === 'team-message') {
          appendContextInput(plainText(data.content), data.source || {}, event.time)
          break
        }
        if (kind === 'user') {
          const text = plainText(data.content)
          if (text.trim()) appendUserMessage(text, event.time)
          appendUserImages(data.content, event.time)
        } else if (kind !== 'tool') {
          const text = plainText(data.content) || contentText(data.content)
          if (text.trim()) appendContextInput(text, data.source || {}, event.time)
        }
        break
      }
      case 'assistant/message': {
        const content = Array.isArray(data.message?.content) ? data.message.content : []
        const reasoning = content.filter(block => block.type === 'reasoning').map(block => block.text || '').join('')
        const text = content.filter(block => block.type === 'text').map(block => block.text || '').join('')
        if (reasoning) pendingReasoning = reasoning
        if (text) setAssistantText(text, false)
        finalizeAssistant()
        break
      }
      case 'tool/call': {
        const speech = formatStageSpeech(data.name, data.arguments)
        if (speech) appendStageSpeech(speech)
        appendToolCall(data.name, data.arguments)
        break
      }
      case 'tool/result': {
        const toolBlock = (data.message?.content || []).find(block => block.type === 'tool-result')
        const resultContent = toolBlock?.content || data.content
        completeTool({
          name: data.name,
          isError: Boolean(data.error || data.isError || toolBlock?.isError),
          content: resultContent,
          text: contentText(resultContent),
        })
        break
      }
      case 'turn/end':
        endTurn()
        break
      default:
        break
    }
  }

  async function loadInitialHistory() {
    const limit = 5000
    const batches = []
    let before = null
    for (;;) {
      const url = before !== null ? '/api/history?before=' + before + '&limit=' + limit : '/api/history?limit=' + limit
      const res = await apiFetch(url)
      if (!res.ok) break
      const payload = await res.json()
      const events = Array.isArray(payload.events) ? payload.events : []
      if (events.length === 0) break
      batches.unshift(events)
      if (!payload.hasMore) break
      before = payload.nextBefore
    }
    if (batches.length === 0) { setEmpty(true); return }
    const all = batches.flat()
    const startIndex = all.findIndex(event => event.type === 'turn/start')
    const timeline = startIndex === -1 ? all : all.slice(startIndex)

    const fragment = document.createDocumentFragment()
    const savedParent = turnParent
    turnParent = fragment
    currentTurn = null
    currentAssistant = null
    currentTool = null
    currentRawGroup = null
    currentRawEvents = []
    currentRawCounts = {}
    pendingReasoning = ''
    for (const event of timeline) renderHistoricalEvent(event)
    $messages.appendChild(fragment)
    turnParent = savedParent
    currentTurn = null
    currentAssistant = null
    currentTool = null
    currentRawGroup = null
    currentRawEvents = []
    currentRawCounts = {}
    pendingReasoning = ''
    if ($messages.children.length > 0) setEmpty(false)
    pinned = true
    scrollBottom(true)
    setTimeout(() => scrollBottom(true), 160)
  }

  async function fullReload() {
    if (reloading) return
    reloading = true
    try {
      if (sse) { sse.close(); sse = null }
      resetFlow()
      contextNodeCache = new Map()
      contextExpanded = new Set()
      await loadStatus()
      await loadInitialHistory()
      sse = connectSSE()
      refreshObservability()
      if (activeTab === 'context') refreshContext(true)
    } catch (error) {
      setConnection('error', '加载失败：' + (error && error.message ? error.message : String(error)))
    } finally {
      reloading = false
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) fullReload()
  })

  // ── scroll ────────────────────────────────────────────────────────────────
  function maintainBottom() {
    if (pinned) $transcript.scrollTop = $transcript.scrollHeight
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(maintainBottom).observe($messages)
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(maintainBottom).catch(() => {})

  $transcript.addEventListener('scroll', () => {
    pinned = isNearBottom()
    updateToBottom()
  })
  $toBottom.addEventListener('click', () => {
    pinned = true
    scrollBottom(true)
    updateToBottom()
  })

  // ── composer events ───────────────────────────────────────────────────────
  $send.addEventListener('click', sendMessage)
  $attach.addEventListener('click', () => $imageInput.click())
  $imageInput.addEventListener('change', () => {
    addFiles($imageInput.files || [])
    $imageInput.value = ''
  })
  $input.addEventListener('input', () => { autoGrow(); updateSendState() })
  $input.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
      event.preventDefault()
      sendMessage()
    }
  })
  window.addEventListener('paste', event => {
    const files = event.clipboardData && event.clipboardData.files
    if (files && files.length > 0) {
      const images = Array.from(files).filter(file => file.type.startsWith('image/'))
      if (images.length > 0) {
        event.preventDefault()
        addFiles(images)
      }
    }
  })
  $composerCard.addEventListener('dragover', event => {
    event.preventDefault()
    $composerCard.classList.add('dragover')
  })
  $composerCard.addEventListener('dragleave', () => $composerCard.classList.remove('dragover'))
  $composerCard.addEventListener('drop', event => {
    event.preventDefault()
    $composerCard.classList.remove('dragover')
    if (event.dataTransfer && event.dataTransfer.files) addFiles(event.dataTransfer.files)
  })

  // ── theme ─────────────────────────────────────────────────────────────────
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme
    const dark = theme === 'dark'
    $themeIcon.innerHTML = dark
      ? '<path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2z"></path>'
      : '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>'
    localStorage.setItem('assistant-webui-theme', theme)
  }
  $themeToggle.addEventListener('click', () => {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark')
  })

  // ── swarm ────────────────────────────────────────────────────────────────
  function swarmParentLabel(member) {
    if (!swarmSnapshot) return '主助手'
    if (member.parentId === swarmSnapshot.main.sessionId) return '主助手'
    return (swarmSnapshot.members || []).find(item => item.id === member.parentId)?.label || '主助手'
  }

  function startSwarmPolling() {
    if (swarmPollTimer) return
    swarmPollTimer = setInterval(() => { void refreshSwarm() }, 2000)
  }

  function stopSwarmPolling() {
    if (!swarmPollTimer) return
    clearInterval(swarmPollTimer)
    swarmPollTimer = null
  }

  async function refreshSwarm(force = false) {
    if (!force && activeTab !== 'swarm') return
    if (swarmLoading) return
    swarmLoading = true
    try {
      const response = await apiFetch('/api/swarm')
      if (!response.ok) throw new Error('HTTP ' + response.status)
      swarmSnapshot = await response.json()
      swarmError = ''
    } catch (error) {
      swarmError = error && error.message ? error.message : String(error)
    } finally {
      swarmLoading = false
      renderSwarm()
    }
  }

  function renderSwarm() {
    if (!swarmSnapshot) {
      $swarmInner.innerHTML = ''
      $swarmInner.appendChild(el('div', 'swarm-empty', swarmError
        ? '读取蜂群失败：' + swarmError + '\n如果助手刚升级，请重启该助手后再打开此页。'
        : '正在读取蜂群…'))
      return
    }
    const snapshot = swarmSnapshot
    $swarmInner.innerHTML = ''

    const hero = el('div', 'swarm-hero')
    const title = el('div', 'swarm-hero-title')
    title.appendChild(el('span', '', '蜂群'))
    title.appendChild(el('span', 'swarm-chip', '主助手：' + (snapshot.main?.name || '主助手')))
    hero.appendChild(title)
    const sub = el('div', 'swarm-hero-sub')
    const counts = snapshot.counts || {}
    for (const [label, value] of [
      ['成员', counts.total ?? 0],
      ['运行中', counts.running ?? 0],
      ['完成', counts.done ?? 0],
      ['失败', counts.failed ?? 0],
      ['归档', counts.archived ?? 0],
      ['并发上限', snapshot.limits?.maxMembers ?? '-'],
      ['深度上限', snapshot.limits?.maxDepth ?? '-'],
    ]) {
      const chip = el('span', 'swarm-chip')
      chip.appendChild(el('b', '', String(value)))
      chip.appendChild(el('span', '', ' ' + label))
      sub.appendChild(chip)
    }
    hero.appendChild(sub)
    $swarmInner.appendChild(hero)

    // 共享上下文
    const context = snapshot.sharedContext || { entries: [], pendingProposals: [], bytes: 0, version: 0, limits: {} }
    const contextSection = el('details', 'swarm-section')
    contextSection.open = swarmContextOpen
    contextSection.addEventListener('toggle', () => { swarmContextOpen = contextSection.open })
    const contextHead = el('summary', 'swarm-section-head')
    contextHead.appendChild(el('span', '', '共享上下文'))
    contextHead.appendChild(el('span', 'swarm-chip', 'v' + (context.version ?? 0)))
    contextHead.appendChild(el('span', 'spacer'))
    if ((context.pendingProposals || []).length > 0) contextHead.appendChild(el('span', 'swarm-pending', '待审 ' + context.pendingProposals.length))
    contextSection.appendChild(contextHead)
    const contextBody = el('div', 'swarm-section-body')
    const cap = el('div', 'swarm-context-cap')
    const bar = el('i')
    const maxBytes = context.limits?.maxBytes || 8192
    bar.style.width = Math.min(100, Math.round(((context.bytes || 0) / maxBytes) * 100)) + '%'
    cap.appendChild(bar)
    contextBody.appendChild(cap)
    contextBody.appendChild(el('div', 'swarm-card-meta', `${context.bytes || 0} / ${maxBytes} bytes · ${(context.entries || []).length} 条`))
    if ((context.entries || []).length === 0) {
      contextBody.appendChild(el('div', 'swarm-card-task', '还没有共享上下文。主 agent 可以通过 swarm_context_write 写入，成员可以提案。'))
    } else {
      for (const entry of context.entries) {
        const row = el('div', 'swarm-context-entry')
        row.appendChild(el('span', 'k', entry.title + ' (' + entry.key + ')'))
        row.appendChild(el('div', 'v', entry.content))
        contextBody.appendChild(row)
      }
    }
    for (const proposal of context.pendingProposals || []) {
      const row = el('div', 'swarm-context-entry')
      row.appendChild(el('span', 'k', '候选 · ' + proposal.title + ' (' + proposal.key + ')'))
      row.appendChild(el('div', 'v', proposal.content))
      contextBody.appendChild(row)
    }
    contextSection.appendChild(contextBody)
    $swarmInner.appendChild(contextSection)

    // 聚焦提示
    const focusBar = el('div', 'swarm-focus-bar')
    focusBar.id = 'swarm-focus-bar'
    $swarmInner.appendChild(focusBar)

    // 成员网格
    const grid = el('div', 'swarm-grid')
    grid.id = 'swarm-grid'
    const members = snapshot.members || []
    const topMembers = members.filter(member => member.parentId === snapshot.main.sessionId)
    if (topMembers.length === 0) {
      $swarmInner.appendChild(el('div', 'swarm-empty', '还没有子 Agent — 当主助手通过 swarm_dispatch 委派任务时，蜂群会在这里展开。'))
    } else {
      for (const member of topMembers) {
        const card = el('div', 'swarm-card')
        card.dataset.id = member.id
        const head = el('div', 'swarm-card-head')
        head.appendChild(el('span', 'swarm-dot ' + member.status))
        head.appendChild(el('span', 'swarm-card-name', member.label || member.id.slice(0, 8)))
        card.appendChild(head)
        const meta = el('div', 'swarm-card-meta')
        meta.appendChild(el('span', 'swarm-badge mode', member.mode === 'resident' ? '常驻蜂' : '任务蜂'))
        meta.appendChild(el('span', 'swarm-badge', 'depth ' + member.depth))
        meta.appendChild(el('span', 'swarm-badge', member.status))
        card.appendChild(meta)
        if (member.task) card.appendChild(el('div', 'swarm-card-task', member.task))
        if (member.summary) card.appendChild(el('div', 'swarm-card-task', member.summary))
        card.addEventListener('mouseenter', () => setSwarmFocus(member.id))
        card.addEventListener('focus', () => setSwarmFocus(member.id))
        card.addEventListener('mouseleave', () => setSwarmFocus(null))
        card.addEventListener('click', event => {
          event.stopPropagation()
          setSwarmFocus(member.id)
          openSwarmDrawer(member)
        })
        card.tabIndex = 0
        grid.appendChild(card)
      }
      $swarmInner.appendChild(grid)
      const downstream = el('div', 'swarm-grid')
      downstream.id = 'swarm-downstream'
      downstream.style.marginTop = '10px'
      $swarmInner.appendChild(downstream)
    }

    // 通讯 / 完成标记
    const feed = el('div', 'swarm-section')
    const feedHead = el('div', 'swarm-section-head')
    feedHead.appendChild(el('span', '', '通讯 / 完成标记'))
    feed.appendChild(feedHead)
    const feedBody = el('div', 'swarm-section-body')
    const lines = []
    for (const member of members) {
      if (member.createdAt) lines.push({
        time: member.createdAt,
        route: swarmParentLabel(member) + ' → ' + (member.label || '成员'),
        text: member.task || '派发任务',
      })
      if (member.finishedAt) lines.push({
        time: member.finishedAt,
        route: (member.label || '成员') + ' → ' + swarmParentLabel(member),
        text: (member.status === 'done' ? '✓ 完成' : '✕ ' + (member.stopReason || '失败')) + (member.summary ? ' · ' + member.summary : ''),
      })
    }
    lines.sort((a, b) => a.time.localeCompare(b.time))
    if (lines.length === 0) {
      feedBody.appendChild(el('div', 'swarm-empty', '还没有通讯记录'))
    } else {
      for (const line of lines) {
        const row = el('div', 'swarm-feed-line')
        const time = new Date(line.time)
        row.appendChild(el('div', 'swarm-feed-time', isNaN(time.getTime()) ? '' : time.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })))
        const main = el('div', 'swarm-feed-main')
        main.appendChild(el('div', 'swarm-feed-route', line.route))
        main.appendChild(el('div', 'swarm-feed-text', line.text))
        row.appendChild(main)
        feedBody.appendChild(row)
      }
    }
    feed.appendChild(feedBody)
    $swarmInner.appendChild(feed)

    setSwarmFocus(swarmFocusId)
  }

  function setSwarmFocus(id) {
    swarmFocusId = id
    const grid = document.getElementById('swarm-grid')
    const bar = document.getElementById('swarm-focus-bar')
    const downstream = document.getElementById('swarm-downstream')
    if (!grid) return
    grid.classList.toggle('has-focus', Boolean(id))
    for (const card of grid.querySelectorAll('.swarm-card')) {
      card.classList.toggle('focused', Boolean(id) && card.dataset.id === id)
    }
    if (downstream) downstream.innerHTML = ''
    if (!bar) return
    if (!id || !swarmSnapshot) { bar.classList.remove('show'); bar.textContent = ''; return }
    const member = (swarmSnapshot.members || []).find(item => item.id === id)
    if (!member) { bar.classList.remove('show'); return }
    const children = (swarmSnapshot.members || []).filter(item => item.parentId === id)
    bar.classList.add('show')
    bar.innerHTML = ''
    bar.appendChild(el('span', '', '上游：'))
    bar.appendChild(el('b', '', swarmParentLabel(member)))
    bar.appendChild(el('span', '', '　下游：'))
    bar.appendChild(el('b', '', String(children.length)))
    if (children.length === 0) return
    // 下游（2 级）只在聚焦时出现，默认不铺满页面。
    const label = el('div', 'swarm-card-meta')
    label.style.width = '100%'
    label.textContent = '下游成员（' + children.length + '）'
    downstream.appendChild(label)
    for (const child of children) {
      const card = el('div', 'swarm-card')
      card.dataset.id = child.id
      const head = el('div', 'swarm-card-head')
      head.appendChild(el('span', 'swarm-dot ' + child.status))
      head.appendChild(el('span', 'swarm-card-name', child.label || child.id.slice(0, 8)))
      card.appendChild(head)
      const meta = el('div', 'swarm-card-meta')
      meta.appendChild(el('span', 'swarm-badge mode', child.mode === 'resident' ? '常驻蜂' : '任务蜂'))
      meta.appendChild(el('span', 'swarm-badge', child.status))
      card.appendChild(meta)
      card.addEventListener('mouseenter', () => setSwarmFocus(child.id))
      card.addEventListener('mouseleave', () => { if (swarmFocusId === child.id) setSwarmFocus(member.id) })
      card.addEventListener('click', event => { event.stopPropagation(); setSwarmFocus(child.id); openSwarmDrawer(child) })
      downstream.appendChild(card)
    }
  }

  function installSwarmEvents() {
    $swarmDrawerClose.addEventListener('click', closeSwarmDrawer)
    $swarmView.addEventListener('click', event => {
      if (event.target === $swarmView || event.target === document.getElementById('swarm-scroll')) setSwarmFocus(null)
    })
  }

  function openSwarmDrawer(member) {
    closeSwarmDrawer()
    swarmDrawerId = member.id
    swarmDrawerSeq = -1
    swarmDrawerEventCount = 0
    $swarmDrawer.hidden = false
    $swarmDrawerDot.className = 'swarm-dot ' + member.status
    $swarmDrawerTitle.textContent = member.label || member.id
    $swarmDrawerMeta.innerHTML = ''
    for (const text of [
      member.mode === 'resident' ? '常驻蜂' : '任务蜂',
      'depth ' + member.depth,
      '状态 ' + member.status,
      member.jobId ? 'job ' + member.jobId : '',
      member.finishedAt ? '完成 ' + new Date(member.finishedAt).toLocaleString() : '',
    ].filter(Boolean)) {
      $swarmDrawerMeta.appendChild(el('span', 'swarm-badge', text))
    }
    $swarmDrawerBody.innerHTML = '<div class="swarm-empty">正在读取成员会话…</div>'
    try {
      const source = new EventSource(withAuth('/api/swarm/member/' + encodeURIComponent(member.id) + '/stream'))
      swarmDrawerSource = source
      source.onmessage = (event) => {
        if (swarmDrawerId !== member.id) return
        try {
          const frame = JSON.parse(event.data)
          if (frame && frame.type === 'session_event') appendSwarmEvent(frame.data)
        } catch { /* ignore malformed frame */ }
      }
      source.onerror = () => {
        if (swarmDrawerSource === source) source.close()
      }
    } catch {
      $swarmDrawerBody.innerHTML = '<div class="swarm-empty">无法连接成员会话</div>'
    }
  }

  function closeSwarmDrawer() {
    if (swarmDrawerSource) {
      try { swarmDrawerSource.close() } catch { /* ignore */ }
      swarmDrawerSource = null
    }
    swarmDrawerId = null
    swarmDrawerSeq = -1
    swarmDrawerEventCount = 0
    if ($swarmDrawer) $swarmDrawer.hidden = true
  }

  function appendSwarmEvent(event) {
    if (!event || typeof event !== 'object') return
    const seq = typeof event.seq === 'number' ? event.seq : -1
    if (seq >= 0 && seq <= swarmDrawerSeq) return
    if (seq >= 0) swarmDrawerSeq = seq
    if (swarmDrawerEventCount === 0) $swarmDrawerBody.innerHTML = ''
    const type = event.type
    const data = event.data || {}
    if (type === 'user/message') {
      const text = plainText(data.content)
      if (text) {
        const item = el('div', 'swarm-event user')
        item.appendChild(el('span', 'tag', '任务 / 输入'))
        item.appendChild(el('div', 'body', text))
        $swarmDrawerBody.appendChild(item)
        swarmDrawerEventCount += 1
      }
    } else if (type === 'assistant/message') {
      const content = Array.isArray(data.message?.content) ? data.message.content : []
      const text = contentText(content)
      if (text) {
        const item = el('div', 'swarm-event assistant')
        item.appendChild(el('span', 'tag', '助手'))
        item.appendChild(el('div', 'body', text))
        $swarmDrawerBody.appendChild(item)
        swarmDrawerEventCount += 1
      }
    } else if (type === 'tool/call') {
      const item = el('div', 'swarm-event tool')
      item.appendChild(el('span', 'tag', 'tool · ' + (data.name || 'unknown')))
      item.appendChild(el('div', 'body', JSON.stringify(data.arguments || {}, null, 2).slice(0, 1200)))
      $swarmDrawerBody.appendChild(item)
      swarmDrawerEventCount += 1
    } else if (type === 'tool/result') {
      const content = data.message?.content || data.content || []
      const text = contentText(content)
      if (text) {
        const item = el('div', 'swarm-event tool')
        item.appendChild(el('span', 'tag', 'tool result' + (data.name ? ' · ' + data.name : '')))
        item.appendChild(el('div', 'body', text.slice(0, 1200)))
        $swarmDrawerBody.appendChild(item)
        swarmDrawerEventCount += 1
      }
    } else if (type === 'turn/end') {
      const reason = data.reason?.kind || data.reason || 'end'
      const item = el('div', 'swarm-event tool')
      item.appendChild(el('span', 'tag', 'turn end'))
      item.appendChild(el('div', 'body', String(reason)))
      $swarmDrawerBody.appendChild(item)
      swarmDrawerEventCount += 1
    }
    if (swarmDrawerEventCount > 0) $swarmDrawerBody.scrollTop = $swarmDrawerBody.scrollHeight
  }

  // ── boot ──────────────────────────────────────────────────────────────────
  async function bootstrap() {
    const savedTheme = localStorage.getItem('assistant-webui-theme')
    applyTheme(savedTheme === 'dark' || savedTheme === 'light'
      ? savedTheme
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'))

    setEmpty(true)
    autoGrow()
    updateComposerHint()
    updateSendState()
    setupTabs()
    installSwarmEvents()
    installContextEvents()

    // 助手可能比页面晚启动：状态接口失败时持续重试。
    for (;;) {
      try {
        await loadStatus()
        break
      } catch (error) {
        setConnection('', '等待助手启动…')
        await new Promise(resolve => setTimeout(resolve, 1500))
      }
    }
    try {
      await loadInitialHistory()
    } catch (error) {
      setConnection('error', '读取历史失败')
    }
    sse = connectSSE()
    refreshObservability()
    if (statsTimer) clearInterval(statsTimer)
    statsTimer = setInterval(refreshObservability, 3000)
    $input.focus({ preventScroll: true })
  }

  bootstrap().catch(error => setConnection('error', error && error.message ? error.message : String(error)))
})()
</script>
</body>
</html>
